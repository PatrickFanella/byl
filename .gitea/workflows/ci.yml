name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  verify:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: museum
          POSTGRES_PASSWORD: museum
          POSTGRES_DB: museum_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U museum -d museum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://museum:museum@localhost:5432/museum_test?sslmode=disable
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache: false
    - name: Verify backend modules and vet
      shell: bash
      run: |-
        go mod verify
        go vet ./...
      working-directory: backend
    - name: Check formatting
      shell: bash
      run: test -z "$(gofmt -l .)"
      working-directory: backend
    - name: Test backend
      shell: bash
      run: go test -count=1 ./...
      working-directory: backend
    - name: Build backend
      shell: bash
      run: go build ./...
      working-directory: backend
  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install
      shell: bash
      run: npm install -g npm@11 && npm ci --legacy-peer-deps
      working-directory: web
    - name: Check, lint, unit test, build
      shell: bash
      run: |-
        npm run gen:api
        npm run check
        npm run lint
        npm run test:unit -- --run
        npm run build
      working-directory: web
