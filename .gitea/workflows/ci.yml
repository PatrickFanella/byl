name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  verify:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache: false
    - name: Verify backend modules and vet
      shell: bash
      run: |-
        go mod verify
        go vet ./...
      working-directory: backend
    - name: Check formatting
      shell: bash
      run: test -z "$(gofmt -l .)"
      working-directory: backend
    - name: Test backend
      shell: bash
      run: |-
        # Record our own container ID because Gitea does not populate job.services.postgres.id.
        postgres_id="$(docker run --detach --rm --network bridge -e POSTGRES_USER=museum -e POSTGRES_PASSWORD=museum -e POSTGRES_DB=museum_test postgres:16-alpine)"
        trap 'docker stop "$postgres_id" >/dev/null' EXIT
        postgres_host="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$postgres_id")"
        test -n "$postgres_host"
        for attempt in {1..30}; do
          if docker exec "$postgres_id" pg_isready -h 127.0.0.1 -U museum -d museum_test >/dev/null; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo 'Test database did not become ready' >&2
            exit 1
          fi
          sleep 1
        done
        TEST_DATABASE_URL="postgres://museum:museum@$postgres_host:5432/museum_test?sslmode=disable" go test -count=1 ./...
      working-directory: backend
    - name: Build backend
      shell: bash
      run: go build ./...
      working-directory: backend
  web:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v6
    - name: Verify selected BYL assets and generated native palettes
      run: python3 scripts/sync-byl.py --check && python3 scripts/generate-byl-palette.py --check
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache: false
    - name: Install
      shell: bash
      run: npm install -g npm@11 && npm ci --legacy-peer-deps
      working-directory: web
    - name: Check, lint, unit test, build
      shell: bash
      run: |-
        npm run gen:api
        npm run check
        npm run lint
        npm run test:unit -- --run
        npm run build
      working-directory: web
    - name: Install browser
      run: npx playwright install --with-deps chromium
      working-directory: web
    - name: Test visitor and curator flows against an isolated API
      run: bash scripts/test-web-e2e.sh
  android:
    name: Android core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - name: Test Kotlin core
      run: ./gradlew --no-daemon :core:test
      working-directory: android
  ios:
    name: iOS build and package tests
    runs-on: macos
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Test shared Swift package
      run: swift test
      working-directory: ios-invisible-museum/InvisibleMuseumKit
    - name: Build unsigned iOS app
      run: xcodebuild -quiet -project InvisibleMuseum.xcodeproj -scheme InvisibleMuseum -sdk iphoneos -destination generic/platform=iOS -derivedDataPath "$RUNNER_TEMP/invisible-museum-ios" CODE_SIGNING_ALLOWED=NO build
      working-directory: ios-invisible-museum
