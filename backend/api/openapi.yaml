      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BriefStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBriefList" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found or not owned }
        "409": { description: Version or lifecycle conflict }
        "422": { description: Field validation failed }
    post:
      summary: Save a private route brief
      security: [{ bearer: [] }]
      description: Only topic and area are required. At most 10 new briefs per rolling 24 hours and 20 unresolved briefs per account. Retries with the same key and normalized input return the current record; reusing a key for different input returns 409. No evidence or public content is created.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBriefInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "200": { description: Idempotent retry, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "400": { description: Invalid JSON or unknown fields }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "409": { description: Idempotency key conflict }
        "422": { description: Field validation failed }
        "429": { description: Submission limit reached }
  /api/v1/admin/route-briefs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Get a private brief (curators only)
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found or not owned }
        "409": { description: Version or lifecycle conflict }
        "422": { description: Field validation failed }
    put:
      summary: Replace submitted input at the expected version; reset to draft for review
      security: [{ bearer: [] }]
      description: Saves never overwrite a newer version. Processing briefs must be stopped before editing. Any edit requires fresh review, including edits to accepted or declined briefs.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateRouteBriefRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found or not owned }
        "409": { description: Version or lifecycle conflict }
        "422": { description: Field validation failed }
  /api/v1/route-brief-intake:
    get:
      summary: Read whether visitor route suggestions are open
      description: Controlled by PUBLIC_ROUTE_BRIEF_INTAKE_ENABLED, false by default. This capability is not permission to publish or start research. Returns no-store; clients fail closed if unavailable.
      responses:
        "200": { description: Current intake gate, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
  /api/v1/me/route-briefs:
    get:
      summary: List the signed-in account's own private briefs
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BriefStatus" } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBriefList" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found or not owned }
        "409": { description: Version or lifecycle conflict }
        "422": { description: Field validation failed }
    post:
      summary: Submit a private research suggestion when visitor intake is open
      description: Only topic and area are required. Submitted prose remains an unverified lead. Creation stores a private draft for curator triage; it starts no research and publishes no route. Default-off server gate applies to every creation request, including retries. Existing owner status remains readable when intake closes. Uses 10 new briefs per 24 hours and 20 unresolved briefs per account. Responses are no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128, pattern: '^[!-~]+$' }, description: Optional owner-scoped retry key; reuse the exact normalized body to recover a lost response }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBriefInput" } } } }
      responses:
        "201": { description: Private suggestion created, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "200": { description: Existing suggestion for this retry key, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "400": { description: Malformed JSON or unknown fields }
        "401": { description: Authentication required }
        "403": { description: Public intake disabled (intake_disabled) }
        "409": { description: Retry key used for different input }
        "422": { description: Invalid suggestion or retry key }
        "429": { description: Owner submission quota reached }
  /api/v1/me/route-briefs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Get an owned private brief; another owner's record returns 404
      security: [{ bearer: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found or not owned }
        "409": { description: Version or lifecycle conflict }
        "422": { description: Field validation failed }
    put:
      summary: Public intake edits are disabled
      security: [{ bearer: [] }]
      responses: { "401": { description: Authentication required }, "403": { description: Public intake disabled (intake_disabled) } }
  /api/v1/admin/route-briefs/{id}/state:
    post:
      summary: Record a reasoned curator lifecycle decision at the expected version
      description: Draft can enter processing, needs_research, review, or declined. Processing can enter needs_research or review. Needs_research can enter processing, review, or declined. Review can enter accepted, needs_research, or declined. Accepted and declined can reopen as draft. Acceptance records a disposition only and never publishes content.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BriefStateRequest" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RouteBrief" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found or not owned }
        "409": { description: Version or lifecycle conflict }
        "422": { description: Field validation failed }
  /api/v1/admin/route-briefs/{id}/review-package:
    get:
      operationId: adminGetCuratorReviewPackage
      summary: Inspect one complete private curator package
      description: Read-only repeatable-read snapshot of retained drafts, selected dependencies, private passages, proposed shared changes and optional prepared geometry. Curator/admin only, including for a brief's owner. A review version grants no publication authority; approval is a separate operation.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run_id, in: query, schema: { type: string, format: uuid }, description: Retained run belonging to this brief; defaults to latest }
        - { name: tour_id, in: query, schema: { type: string, format: uuid }, description: Optional curated working tour; mismatch remains inspectable with blocking tasks }
        - { name: expected_version, in: query, schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' }, description: Exact prior response version; changed dependencies return 409 }
      responses:
        "200":
          description: Complete or partial private package, including no-run/processing/needs-research cases. Cache-Control no-store and Vary Authorization.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuratorReviewPackage" }
        "401": { description: Unauthorized }
        "403": { description: Curator role required }
        "404": { description: Brief/run/tour unavailable or run belongs to another brief }
        "409": { description: Exact reviewed version changed }
        "422": { description: Invalid version token or package exceeds bounded read size }
  /api/v1/admin/route-briefs/{id}/review-package/publish:
    post:
      operationId: adminPublishCuratorReviewPackage
      summary: Publish the exact reviewed package atomically
      description: Curator approval rechecks the complete package version in a serializable transaction, publishes selected prepared dependencies and a retained tour revision, and accepts the brief. Contextual candidates and proposed shared edits remain untouched. Private approval provenance is retained internally and excluded from public revision responses.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, run_id, tour_id]
              properties:
                version: { type: string, pattern: '^[a-f0-9]{64}$' }
                run_id: { type: string, format: uuid }
                tour_id: { type: string, format: uuid }
                note: { type: string, maxLength: 2000, description: Decision reason visible to the brief owner }
      responses:
        "200": { description: Published immutable revision, content: { application/json: { schema: { $ref: "#/components/schemas/TourRevision" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Selected brief, run or tour unavailable }
        "409": { description: Stale, incomplete or concurrently changed review; no package changes committed }
        "422": { description: Invalid request }
  /api/v1/admin/route-briefs/{id}/itinerary:
    get:
      summary: Inspect a private source-linked itinerary proposal
      description: Curators only, including for the brief owner. Returns the latest research run or a specified retained run. No tour is created, no source/candidate is approved, and no travel distance or time is claimed before computation.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: run_id, in: query, schema: { type: string, format: uuid }, description: Optional retained research run belonging to this brief }
      responses:
        "200": { description: Private snapshot or null proposal while assembly is pending, content: { application/json: { schema: { $ref: "#/components/schemas/BriefItinerary" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief or research run not found }
        "422": { description: Invalid retained proposal }
  /api/v1/admin/route-briefs/{id}/research:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Get the latest private research progress (curators only)
      description: Source content, submitted snapshots, raw provider errors and stage output are excluded. Owners cannot read another owner's progress. This status read does not enable intake or research.
      security: [{ bearer: [] }]
      responses:
        "200": { description: Private progress, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Private brief or research run not found }
        "409": { description: Stale version, invalid state, or exhausted resume budget }
        "422": { description: Invalid request }
    post:
      summary: Start bounded research at the saved brief version
      description: Only draft and needs_research briefs may start. Repeating a source version returns its original run. Queues a private job; an absent processor records processor_unavailable, never fabricated research. No automatic publication.
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchActionRequest" } } } }
      responses:
        "202": { description: Research queued or original run returned, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Private brief or research run not found }
        "409": { description: Stale version, invalid state, or exhausted resume budget }
        "422": { description: Invalid request }
  /api/v1/me/route-briefs/{id}/research:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Get the latest research progress for an owned brief
      description: Source content, submitted snapshots, raw provider errors and stage output are excluded. Owners cannot read another owner's progress. This status read does not enable intake or research.
      security: [{ bearer: [] }]
      responses:
        "200": { description: Private progress, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Private brief or research run not found }
        "409": { description: Stale version, invalid state, or exhausted resume budget }
        "422": { description: Invalid request }
  /api/v1/admin/route-briefs/{id}/research/cancel:
    post:
      summary: Cancel research and release the brief for edits
      description: Cancellation immediately marks the brief needs_research. In-flight provider results cannot commit afterward.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchActionRequest" } } } }
      responses:
        "202": { description: Research action recorded, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Private brief or research run not found }
        "409": { description: Stale version, invalid state, or exhausted resume budget }
        "422": { description: Invalid request }
  /api/v1/admin/route-briefs/{id}/research/resume:
    post:
      summary: Resume incomplete stages without resetting work budgets
      description: Requires unchanged submitted input and remaining request, model, stage retry and elapsed budgets. Preserves completed stages and candidate edits. Creates a fresh job ID to fence old workers.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchActionRequest" } } } }
      responses:
        "202": { description: Research action recorded, content: { application/json: { schema: { $ref: "#/components/schemas/ResearchRun" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Private brief or research run not found }
        "409": { description: Stale version, invalid state, or exhausted resume budget }
        "422": { description: Invalid request }
  /api/v1/admin/route-briefs/{id}/evidence:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: List private source evidence for a brief (curators only)
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: Private evidence snapshots, content: { application/json: { schema: { $ref: "#/components/schemas/SourceEvidenceList" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required; owners do not receive source payloads }
        "404": { description: Brief not found }
    post:
      summary: Queue one bounded private source inspection (curators only)
      description: At most 20 requests per brief per rolling 24 hours. HTTP/HTTPS standard ports only, no credentials. Host addresses are checked at connection time; private hosts remain forbidden even if the media/archive private-host option is enabled. A job permits at most three attempts, each at most three HTTP requests and 20 seconds, with a 2 MiB response and 20000-character excerpt bound. This is an explicit curator retrieval, not automatic discovery or publication. Retries with the same key and normalized request return the original snapshot.
      security: [{ bearer: [] }]
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceRequest" } } } }
      responses:
        "202": { description: Queued or idempotent replay, content: { application/json: { schema: { $ref: "#/components/schemas/SourceEvidence" } } } }
        "400": { description: Invalid JSON }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found }
        "409": { description: Stale brief version or reused request key }
        "422": { description: Invalid source URL or request }
        "429": { description: Evidence request quota reached }
  /api/v1/admin/route-briefs/{id}/evidence/{evidence}:
