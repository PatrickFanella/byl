  /api/v1/places/{place}/arrival:
    get:
      summary: Select a reviewed public navigation point independently for walking or biking
      description: Unknown, restricted and closed access return a null navigation_point. The historical site coordinate, nearby road or another mode is never substituted. Source retrieval context is evidence for review, not an accessibility or legal-access guarantee. Legacy places return explicit unknown access.
      parameters:
        - { name: place, in: path, required: true, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [walk, bike], default: walk } }
      responses:
        "200": { description: Reviewed point or explicit access gap, content: { application/json: { schema: { $ref: "#/components/schemas/ArrivalSelection" } } } }
        "404": { description: Published place not found }
        "409": { description: Ambiguous place slug; provide city }
        "422": { description: Invalid mode }
  /api/v1/admin/places/{id}/arrivals:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Page private arrival proposal and review history (curators only)
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: Private arrival history, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ArrivalProposal" } } } } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Place not found }
    post:
      summary: Propose an entrance or viewpoint without changing the approved point
      description: Immutable input. Version is the current approved arrival_version (zero for legacy places). Source context and independent walk/bike eligibility are public only after explicit curator approval. Unknown access must be represented explicitly.
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ArrivalProposalRequest" } } } }
      responses:
        "201": { description: Private pending arrival proposal, content: { application/json: { schema: { $ref: "#/components/schemas/ArrivalProposal" } } } }
        "400": { description: Invalid JSON }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Place not found }
        "409": { description: Approved arrival changed; reload before proposing }
        "422": { description: Invalid coordinates, modes or missing source context }
  /api/v1/admin/places/{id}/arrivals/{arrival}/review:
    post:
      summary: Explicitly approve or reject an immutable arrival proposal
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: arrival, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ArrivalReviewRequest" } } } }
      responses:
        "200": { description: Review recorded; approval atomically advances the public pointer, content: { application/json: { schema: { $ref: "#/components/schemas/ArrivalProposal" } } } }
        "400": { description: Invalid JSON }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Proposal not found under this place }
        "409": { description: Already reviewed or a newer arrival was approved }
        "422": { description: Invalid review or source context }
  /api/v1/tours/{tour}/revisions:
    get:
      summary: List immutable published tour revision metadata
      description: Current tour visibility still applies. Private historical releases are visible only to the owner or curators.
      parameters:
        - { name: tour, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: Retained release metadata without snapshot bodies, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/TourRevision" } } } } } } }
        "404": { description: Visible tour not found }
  /api/v1/tours/{tour}/revisions/{revision}:
    get:
      summary: Read a pinned itinerary, reviewed story text, input intent and full geometry
      description: Snapshot content is immutable. Current visibility revocation and deletion still apply, as does visibility of this historical release. Media references and rights metadata are pinned; this is not a promise of perpetual remote file availability.
      parameters:
        - { name: tour, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Immutable tour release, content: { application/json: { schema: { $ref: "#/components/schemas/TourRevision" } } } }
        "404": { description: Visible revision not found under this tour }
  /api/v1/me/progress/{tour}/revisions/{revision}:
    parameters:
      - { name: tour, in: path, required: true, schema: { type: string } }
      - { name: revision, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read this account's progress on one immutable itinerary
      security: [{ bearer: [] }]
      responses:
        "200": { description: Private revision-scoped progress, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionProgress" } } } }
        "401": { description: Authentication required }
        "404": { description: Visible revision or this account's progress not found }
    put:
      summary: Merge stable stop visits within exactly one revision
      description: No position-based or cross-revision inheritance. Stop IDs must belong to this snapshot. Reset clears this revision's trip and cannot include visits or completion. Neither navigation progress nor a reset grants contribution consent.
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionProgressRequest" } } } }
      responses:
        "200": { description: Private progress updated, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionProgress" } } } }
        "400": { description: Invalid JSON or unknown fields }
        "401": { description: Authentication required }
        "404": { description: Visible revision not found under this tour }
        "422": { description: Invalid mode, reset or stop identity }
  /api/v1/me/tours/{id}/publish:
    post:
      summary: Explicitly release an owned tour draft as a new immutable revision
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/PublishRevisionRequest" } } } }
      responses:
        "200": { description: Released latest-tour view, content: { application/json: { schema: { $ref: "#/components/schemas/TourDetail" } } } }
        "401": { description: Authentication required }
        "404": { description: Owned tour not found }
        "409": { description: Stale draft/published pointer, unready routes, changed routing inputs or publication blockers }
        "422": { description: Invalid expected version }
  /api/v1/itinerary-capabilities:
    get:
      summary: Read the independent scheduled-transit capability gate
      description: Defaults off. TRANSIT_PROVIDER=cta configures private curator verification; SCHEDULED_TRANSIT_ENABLED separately admits public clients. Requests for mixed tours must also send X-Byl-Capabilities with the token scheduled-transit-v1. Unsupported/disabled public discovery excludes those tours; mixed detail, route, revision and progress requests return 409 rather than walking geometry. Older pinned ordinary revisions remain accessible. Responses are no-store and vary on Authorization and X-Byl-Capabilities.
      responses:
        "200":
          description: Supported contract and current public admission
          content:
            application/json:
              schema:
                type: object
                required: [scheduled_transit_v1, provider, live, transfers, bicycles]
                properties:
                  scheduled_transit_v1: { type: boolean }
                  provider: { type: string, const: cta_gtfs_blue_v1 }
                  live: { type: boolean, const: false }
                  transfers: { type: boolean, const: false }
                  bicycles: { type: boolean, const: false }
  /api/v1/admin/tours/{id}/transit:
    put:
      summary: Explicitly select or remove one reviewed CTA rail connector
      description: Curator only; 16 KiB strict JSON, no query parameters. Verifies selected Blue Line platforms against the fresh official GTFS provider, retains an immutable curator choice and advances the expected tour draft. Walking times are labeled curator assumptions and require an external-directions handoff. Does not publish or alter a retained revision. Removal works while public transit is off and without a configured provider. Existing walking qualification and public-arrival publication gates still apply.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransitSelectionRequest" } } } }
      responses:
        "200":
          description: Versioned working choice or explicit removal; reload after a lost response
          content:
            application/json:
              schema:
                type: object
                required: [transit, draft_version]
                properties:
                  transit: { $ref: "#/components/schemas/ApprovedTransit", nullable: true }
                  draft_version: { type: integer, minimum: 0 }
        "400": { description: Malformed, oversized or unexpected fields }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Tour not found }
        "409": { description: Draft changed, or selected platforms cannot be verified against a fresh supported timetable }
        "422": { description: Invalid selection, removal, mode, stop adjacency, walking assumptions or review note }
        "503": { description: Provider not configured; removal remains available }
  /api/v1/admin/tours/{id}/transit-plan:
    post:
      summary: Preview a fenced working transit selection without public activation
      description: Curator only; same strict bounded planning body as public planning, with the current draft_version required. The response has revision_id null and identifies its draft_version. Preview does not publish, qualify walking access or create visitor progress.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransitPlanRequest" } } } }
      responses:
        "200": { description: Explicit schedule context or an unavailable/review state, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTransitPlan" } } } }
        "400": { description: Malformed, oversized or unexpected fields }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Tour or transit selection not found }
        "409": { description: Draft changed }
        "422": { description: Missing version/draft, invalid departure or departure outside the supported window }
        "503": { description: Provider not configured }
  /api/v1/tours/{id}/revisions/{revision}/transit-plan:
    post:
      summary: Plan one explicit departure against a frozen curated transit selection
      description: Requires public activation and X-Byl-Capabilities containing scheduled-transit-v1. Uses the selected immutable revision, never a working choice. departure_at means leaving the connector's from_stop_id, not starting the whole tour; it must be in the future and within seven days. Add curator walking time and boarding buffer before selecting one scheduled Blue Line trip. No transfer or bicycle connection is inferred. A separate explicit request may use a newer feed; clients must retain the chosen plan, revision and feed hash rather than silently requerying an active trip. Source stale after 24 hours, missing/missed service, provider failure or moved platforms return explicit nonusable states with no itinerary segments. Scheduled times are not live departures or disruption information. Station connectors have no invented walking geometry; other qualified walking legs remain separate. Bodies are strict 16 KiB JSON with no query parameters. Planning creates no server trip or progress record.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Byl-Capabilities, in: header, required: true, schema: { type: string }, description: Comma-separated tokens including scheduled-transit-v1 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransitPlanRequest" } } } }
      responses:
        "200": { description: Scheduled mixed segments or an explicit unavailable state, content: { application/json: { schema: { $ref: "#/components/schemas/ScheduledTransitPlan" } } } }
        "400": { description: Malformed, oversized or unexpected fields }
        "404": { description: Accessible tour/revision/transit selection not found }
        "409": { description: Public feature disabled or client does not advertise support }
        "422": { description: Invalid version/departure, departure in the past/beyond seven days, or public draft_version supplied }
  /api/v1/route-contribution-intake:
    get:
      summary: Read the independent route-improvement collection gate
      description: Defaults off. Requires explicit runtime activation, matching database custody admission and a two-UTC-day admission hold. Filtered backups omit admission so restoring a database closes collection despite existing enable settings. Navigation and progress never grant consent. The detector is an explicitly uncalibrated reference. Responses are no-store; withdrawal remains available while intake is disabled.
      responses:
        "200":
          description: Collection capability, separate from navigation readiness
          content:
            application/json:
              schema:
                type: object
                required: [enabled, retention_days, detector_version, calibrated, withdrawal_available]
                properties:
                  enabled: { type: boolean }
                  retention_days: { type: integer, const: 30 }
                  detector_version: { type: string, const: uncalibrated-v1 }
                  calibrated: { type: boolean, const: false }
                  withdrawal_available: { type: boolean, const: true }
  /api/v1/me/route-contributions/consent:
    post:
      summary: Make an explicit contribution choice for one retained route and mode
      description: Maximum body 4 KiB; no query parameters or extra fields. Requires a ready retained logical-segment itinerary and a separate accepted version-1 choice. New choices use today's or yesterday's UTC date; exact key/body retries recover an unexpired grant without extending it. The opaque owner scope differs across routes, revisions and modes. Up to 10 new choices per account per UTC day; exact retries consume no additional quota. All responses are no-store and vary on Authorization. Collection requires explicit runtime activation and custody review; it is not enabled by this contract.
      security: [{ bearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }, description: Retain this key and the exact request before sending }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContributionConsentRequest" } } } }
      responses:
        "201": { description: Scoped consent and deletion capability created, content: { application/json: { schema: { $ref: "#/components/schemas/ContributionConsent" } } } }
        "200": { description: Exact unexpired consent replay, content: { application/json: { schema: { $ref: "#/components/schemas/ContributionConsent" } } } }
        "400": { description: Malformed, oversized, unexpected or precise-time input; no submitted values are echoed }
        "401": { description: Authentication required }
        "403": { description: Collection disabled or this choice was withdrawn, expired or needs a fresh explicit request day }
        "404": { description: Accessible retained route not found }
        "409": { description: Retry key reused for a different choice }
        "422": { description: Invalid choice, scope, request day or ready logical-segment references }
        "429": { description: Daily consent quota reached }
  /api/v1/me/route-contributions:
    post:
      summary: Contribute one minimal day-level segment summary after consent
      description: Maximum body 4 KiB; rejects extra fields, coordinates, raw traces, precise timestamps and query parameters. Uses the pure detector's uncalibrated-v1 schema without claiming field calibration. Consent is bound to the authenticated owner, retained revision and mode. Observation day cannot precede the consent day. Logical segment and direction must be selected with allowed access in the retained usable itinerary. One summary per scoped owner/segment/direction/UTC day prevents additional keys or grants from inflating counts; a new key for that day returns already_contributed. Up to 50 new summaries per account per UTC day; exact retries consume no quota. No account/device ID or cross-route owner key is stored with contributions. Responses are no-store and vary on Authorization.
      security: [{ bearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }, description: Same normalized summary/key returns the retained receipt; changed input returns 409 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContributionRequest" } } } }
      responses:
        "201": { description: Minimal private summary retained, content: { application/json: { schema: { $ref: "#/components/schemas/ContributionReceipt" } } } }
        "200": { description: Exact key replay, content: { application/json: { schema: { $ref: "#/components/schemas/ContributionReceipt" } } } }
        "400": { description: Malformed, oversized or unexpected data; no submitted values are echoed }
        "401": { description: Authentication required }
        "403": { description: Intake disabled or scoped consent is absent, withdrawn, expired or later than this observation day }
        "404": { description: Scoped consent or accessible revision not found }
        "409": { description: Changed retry input, expired retained receipt or already_contributed for this scoped segment/direction/day }
        "422": { description: Invalid minimal summary, calibration marker or retained segment reference }
        "429": { description: Daily summary quota reached }
  /api/v1/route-contributions/withdraw:
    post:
      summary: Withdraw a scoped choice and erase its route-mode contributions
      description: Authenticates the random deletion capability in a 4 KiB JSON body, including after sign-out and while collection is off. Never place capabilities in URLs or logs; query parameters are rejected. The first call revokes all currently existing grants in this owner/route/revision/mode scope, removes their summaries and immediately repairs the internal counts view. Minimal revoked grant metadata remains until its original 30-day expiry to prevent request replay. An exact withdrawal replay returns 204 and never revokes a later fresh explicit choice. A missing/expired or incorrect capability returns 404 without exposing another scope. Responses are no-store.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContributionWithdrawal" } } } }
      responses:
        "204": { description: Current scoped data erased, or withdrawal already completed }
        "400": { description: Malformed, oversized, unexpected input or a query parameter }
        "404": { description: Capability no longer retained or incorrect }
  /api/v1/me/route-reports:
    post:
      summary: Submit a private operational report about a frozen tour revision
      description: Accepts a minimal blocked-entrance report without source or alternative. Defaults direction/duration to unknown. No public historical content, trip recording, route mutation or contribution consent is created. Allows 10 new reports per 24 hours and 20 unresolved reports per account; idempotent retries do not consume another slot. Maximum body is 32 KiB.
      security: [{ bearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128, pattern: '^[!-~]+$' }, description: Optional account-scoped printable ASCII retry key; reuse with changed input returns 409 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RouteReportInput" } } } }
      responses:
        "201": { description: Created in private review, content: { application/json: { schema: { $ref: "#/components/schemas/RouteReport" } } } }
        "200": { description: Existing report for this retry key, including current disposition, content: { application/json: { schema: { $ref: "#/components/schemas/RouteReport" } } } }
        "400": { description: Malformed body or unknown field }
        "401": { description: Authentication required }
        "404": { description: Visible tour revision not found }
        "409": { description: Retry key used for different input }
        "413": { description: Body exceeds 32 KiB }
        "422": { description: Invalid input, revision mode/stop/direction references or unrelated geometry }
        "429": { description: Account submission quota reached }
    get:
      summary: List only this account's private route reports
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BriefStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Private report list, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/RouteReport" } }, next_cursor: { type: string } } } } } }
        "401": { description: Authentication required }
        "422": { description: Unknown status }
  /api/v1/me/route-reports/{id}:
    get:
      summary: Read this account's report and private disposition
      description: Remains readable by its submitter after the referenced route is withdrawn. Never includes another account's report.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Private report, content: { application/json: { schema: { $ref: "#/components/schemas/RouteReport" } } } }
        "401": { description: Authentication required }
        "404": { description: Owned report not found }
  /api/v1/me/route-reports/{id}/correction:
    get:
      summary: Read the released correction outcome for this account's report
      description: Returns only old/new public revision IDs and reassessment context. Does not expose private investigation, reviewer or other-tour identifiers. Responses are no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Owned correction outcome, content: { application/json: { schema: { $ref: "#/components/schemas/RouteCorrectionOutcome" } } } }
        "401": { description: Authentication required }
        "404": { description: Owned report or released correction not found }
  /api/v1/admin/route-reports/{id}/correction-comparison:
    get:
      summary: Inspect a current route-correction release comparison
      description: Captures the reported revision, retained investigation, full prepared snapshot, current path evidence, blockers and exact shared-reference impact flags in one repeatable read. A report or proposed line has no publication authority. Responses are no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: investigation_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Private current comparison, content: { application/json: { schema: { $ref: "#/components/schemas/RouteCorrectionComparison" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Report or investigation not found }
  /api/v1/admin/route-reports/{id}/corrections:
    post:
      summary: Release the exact inspected prepared correction atomically
      description: Requires the complete current comparison hash, a completed investigation, unchanged reported release and separately approved durable routing intent for the reported mode. Retains the old revision, accepts only the seed report and flags shared-reference tours without editing them. An exact body replay by the same curator returns the retained result; a changed review returns 409. Temporary detours require a future review date within one year on first approval. Request limit 16 KiB. Responses are no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApproveRouteCorrectionRequest" } } } }
      responses:
        "200": { description: Retained private correction release, content: { application/json: { schema: { $ref: "#/components/schemas/RouteCorrection" } } } }
        "400": { description: Malformed or oversized JSON or unknown fields }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Report or investigation not found }
        "409": { description: Changed comparison, unresolved publication tasks or conflicting previous approval }
        "422": { description: Invalid decision or temporary review date }
  /api/v1/admin/route-corrections:
    get:
      summary: List retained correction releases and due reassessments
      description: Passing a review date marks reassessment required. It does not remove a detour, reopen a closure or rewrite a published revision. Responses are no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters:
        - { name: due, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: Private correction list, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/RouteCorrection" } } } } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "422": { description: Invalid due filter }
  /api/v1/admin/route-reports:
    get:
      summary: List private route reports for curator review
      description: Unresolved reports are listed before completed dispositions; closure, blocked-path and safety observations are prioritized within that group. These remain unverified reports. Owner lists retain newest-first chronology.
      security: [{ bearer: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BriefStatus" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Private report list }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "422": { description: Unknown status }
  /api/v1/admin/route-reports/{id}:
    get:
      summary: Read a private operational report as curator
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Private report, content: { application/json: { schema: { $ref: "#/components/schemas/RouteReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Report not found }
  /api/v1/admin/route-reports/{id}/state:
    post:
      summary: Record a private report disposition at an expected version
      description: Reuses the brief lifecycle, starting in review. Acceptance records a decision only; it edits no tour, entrance, geometry or story. Reasons are private to the submitter and curators. Submitted input is immutable.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BriefStateRequest" } } } }
      responses:
        "200": { description: Updated private disposition, content: { application/json: { schema: { $ref: "#/components/schemas/RouteReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Report not found }
        "409": { description: Stale version or invalid lifecycle transition }
        "422": { description: Invalid decision }
  /api/v1/admin/route-reports/{id}/related:
    get:
      summary: Find related private observations on the exact frozen reference
      description: Matches revision, mode, direction and affected reference only. Similarity is not independent corroboration. Returns no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: Matching observations, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/RouteReport" } } } } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Report not found }
  /api/v1/admin/route-reports/{id}/investigations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List retained private before/after investigations
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200": { description: Checkpoints with private reports and source snapshots, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/RouteInvestigation" } } } } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Report not found }
    post:
      summary: Queue a private researched alternative without changing the route
      description: Captures selected report versions, creates a draft sourcing brief and queues distinct safe source URLs through the existing bounded evidence retriever. Uses brief quotas (10 per day, 20 unresolved) and at most 20 distinct URLs. Only the seed report's alternative or entrance annotation guides computation; related alternatives remain separate observations. Source access does not prove a claim or grant media reuse. Maximum request is 64 KiB. Responses are no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128, pattern: '^[!-~]+$' }, description: Optional curator-scoped retry key; changed request returns 409 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RouteInvestigationRequest" } } } }
      responses:
        "202": { description: Durable investigation and jobs, or existing checkpoint for retry key, content: { application/json: { schema: { $ref: "#/components/schemas/RouteInvestigation" } } } }
        "400": { description: Malformed, oversized JSON or unknown fields }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Report or related report not found }
        "409": { description: Stale seed report version or changed idempotency request }
        "422": { description: Invalid input, duplicate selection, incompatible scope or too many source URLs }
        "429": { description: Sourcing brief quota reached }
  /api/v1/admin/route-reports/{id}/investigations/{investigation}:
    get:
      summary: Read one immutable private investigation under its seed report
      description: Result is null until the worker checkpoints its comparison. The result retains partial or failed research and cannot approve access, accept a report or publish a revision. Returns no-store with Vary Authorization.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: investigation, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Private investigation, content: { application/json: { schema: { $ref: "#/components/schemas/RouteInvestigation" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Investigation not found under this report }
  /api/v1/admin/tours/{id}/corridors:
    get:
      summary: List private corridor proposals and completed reviews
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200": { description: Private review list, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/CorridorProposal" } } } } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Tour not found }
    post:
      summary: Import a bounded reference and propose corridor intent or removal
      description: Curator-only private import, with a 256 KiB body and 5000 total coordinate pairs. Source links are recorded, not fetched. Proposal input is immutable. A proposal captures the current tour draft version; approval compares it and the approved intent version. An explicit removal is separately reviewed.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CorridorProposalRequest" } } } }
      responses:
        "201": { description: Private pending proposal, content: { application/json: { schema: { $ref: "#/components/schemas/CorridorProposal" } } } }
        "400": { description: Malformed input or unknown fields }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Tour not found }
        "409": { description: Approved corridor version changed }
        "413": { description: Import exceeds 256 KiB }
        "422": { description: Invalid reference metadata, topology, mode, geometry or story-stop references }
  /api/v1/admin/tours/{id}/corridors/{proposal}:
    get:
      summary: Read a private immutable proposal and its review
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: proposal, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Private proposal, content: { application/json: { schema: { $ref: "#/components/schemas/CorridorProposal" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Tour/proposal not found }
  /api/v1/admin/tours/{id}/corridors/{proposal}/review:
    post:
      summary: Approve or reject private corridor intent against its base version
      description: Approval advances only the working intent and draft/route versions, requeues routes and clears legacy auto-release intent. Publish the tour explicitly to release it. A changed draft or approved pointer rejects stale approval; rejection leaves the pointer unchanged. This stores reviewed reference choices; route generation still uses historical sites until the later routing integration.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: proposal, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CorridorReviewRequest" } } } }
      responses:
        "200": { description: Completed private review, content: { application/json: { schema: { $ref: "#/components/schemas/CorridorProposal" } } } }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Tour/proposal not found }
        "409": { description: Already reviewed or stale intent/draft version }
        "422": { description: Invalid decision or version }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque session token from one of the /auth endpoints.
  schemas:
    TransitIntent:
      type: object
      additionalProperties: false
      required: [version, provider, mode, from_stop_id, to_stop_id, board_stop_id, alight_stop_id, walk_to_stop_seconds, walk_from_stop_seconds, boarding_buffer_seconds, walking_assumptions]
      properties:
        version: { type: integer, const: 1 }
        provider: { type: string, const: cta_gtfs_blue_v1 }
        mode: { type: string, const: walk }
        from_stop_id: { type: string, format: uuid, description: First of two adjacent story stops in forward order }
        to_stop_id: { type: string, format: uuid }
        board_stop_id: { type: string, pattern: '^[0-9]{1,20}$', description: Explicit Blue Line platform ID, not an inferred nearby station }
        alight_stop_id: { type: string, pattern: '^[0-9]{1,20}$' }
        walk_to_stop_seconds: { type: integer, minimum: 60, maximum: 3600 }
        walk_from_stop_seconds: { type: integer, minimum: 60, maximum: 3600 }
        boarding_buffer_seconds: { type: integer, minimum: 60, maximum: 1800 }
        walking_assumptions: { type: string, minLength: 1, maxLength: 2000, description: Public curator assumptions; these estimates do not establish legal access or field timing }
    TransitSelectionRequest:
      type: object
      additionalProperties: false
      required: [draft_version, review_note]
      description: Provide intent with remove absent/false, or remove true with intent absent/null. The current tour draft fences both actions.
      properties:
        draft_version: { type: integer, minimum: 0 }
        intent: { $ref: "#/components/schemas/TransitIntent", nullable: true }
        remove: { type: boolean }
        review_note: { type: string, minLength: 1, maxLength: 4000, description: Private curator rationale retained in append-only review history }
    TransitPlatform:
      type: object
      required: [id, name, parent_id, latitude, longitude]
      properties:
        id: { type: string }
        name: { type: string }
        parent_id: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    TransitSource:
      type: object
      required: [url, publisher, sha256, retrieved_at, license_url, timezone]
      properties:
        url: { type: string, format: uri }
        publisher: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Exact source archive identity, not the identity of a trip or person }
        retrieved_at: { type: string, format: date-time }
        license_url: { type: string, format: uri }
        timezone: { type: string, const: America/Chicago }
    ApprovedTransit:
      type: object
      required: [version, intent, board, alight, source, reviewed_at]
      properties:
        version: { type: integer, minimum: 1 }
        intent: { $ref: "#/components/schemas/TransitIntent" }
        board: { $ref: "#/components/schemas/TransitPlatform" }
        alight: { $ref: "#/components/schemas/TransitPlatform" }
        source: { $ref: "#/components/schemas/TransitSource" }
        reviewed_at: { type: string, format: date-time }
        walking_legs: { type: array, items: { $ref: "#/components/schemas/RouteLeg" }, description: Frozen revision only; ordinary qualified legs with the transit-replaced leg omitted. No continuous walking geometry is published for the mixed mode. }
    TransitPlanRequest:
      type: object
      additionalProperties: false
      required: [version, departure_at]
      properties:
        version: { type: integer, const: 1 }
        departure_at: { type: string, format: date-time, description: Future departure from the selected story stop within seven days; its preceding stories/dwell are outside this context }
        draft_version: { type: integer, minimum: 0, nullable: true, description: Required current integer on private preview; omit or use null for a public immutable-revision request }
    TransitConnection:
      type: object
      required: [state, scheduled, live, issues]
      properties:
        state: { type: string, enum: [scheduled, no_service, stale, provider_unavailable, unavailable, unsupported, needs_review] }
        scheduled: { type: boolean, const: true }
        live: { type: boolean, const: false }
        source: { $ref: "#/components/schemas/TransitSource" }
        board: { $ref: "#/components/schemas/TransitPlatform" }
        alight: { $ref: "#/components/schemas/TransitPlatform" }
        trip_id: { type: string, description: Provider timetable trip identifier, not a visitor trip identifier }
        route_id: { type: string, const: Blue }
        headsign: { type: string }
        departure_at: { type: string, format: date-time }
        arrival_at: { type: string, format: date-time }
        issues: { type: array, items: { type: string } }
    TransitPlanSegment:
      type: object
      required: [kind, duration_s, basis, navigation]
      properties:
        kind: { type: string, enum: [walk, walk_to_stop, boarding_wait, transit, walk_from_stop] }
        from_stop_id: { type: string, format: uuid }
        to_stop_id: { type: string, format: uuid }
        from_platform_id: { type: string }
        to_platform_id: { type: string }
        duration_s: { type: integer, minimum: 0, description: Basis distinguishes qualified route metrics, curator estimates and the static schedule }
        departure_at: { type: string, format: date-time }
        arrival_at: { type: string, format: date-time }
        basis: { type: string, enum: [retained_qualified_walking_route, curator_walking_estimate, schedule_and_curator_buffer, cta_static_schedule] }
        navigation: { type: string, enum: [in_app_walking, external_directions_required, check_station_signs_and_alerts, scheduled_rail] }
        geometry:
          type: object
          description: Present only for an ordinary retained walking section; station and rail connectors omit it
          required: [type, coordinates]
          properties:
            type: { type: string, const: LineString }
            coordinates: { type: array, minItems: 2, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }
    ScheduledTransitPlan:
      type: object
      required: [version, tour_id, revision_id, connector_version, state, requested_departure_at, departure_context_stop_id, service, segments, assumptions]
      properties:
        version: { type: integer, const: 1 }
        tour_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid, nullable: true, description: Immutable selection context; null for a private working preview }
        draft_version: { type: integer, minimum: 0, description: Present only for a fenced working preview }
        connector_version: { type: integer, minimum: 1 }
        state: { type: string, enum: [scheduled, no_service, stale, provider_unavailable, unavailable, unsupported, needs_review] }
        requested_departure_at: { type: string, format: date-time }
        departure_context_stop_id: { type: string, format: uuid }
        service: { $ref: "#/components/schemas/TransitConnection" }
        segments: { type: array, items: { $ref: "#/components/schemas/TransitPlanSegment" }, description: Ordered mixed sections; empty whenever the overall plan is unavailable or needs review }
        assumptions: { type: array, items: { type: string } }
    ContributionConsentRequest:
      type: object
      additionalProperties: false
      required: [version, accepted, tour_id, revision_id, mode, requested_on]
      properties:
        version: { type: integer, const: 1 }
        accepted: { type: boolean, const: true }
        tour_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/TravelMode" }
        requested_on: { type: string, format: date, description: UTC calendar day; new choices need today or yesterday, exact retained retries remain valid until original expiry }
    ContributionConsent:
      type: object
      required: [id, deletion_handle, expires_on]
      properties:
        id: { type: string, format: uuid }
        deletion_handle: { type: string, minLength: 64, maxLength: 64, description: Sensitive random-looking 256-bit scoped deletion capability; retain privately and never put in URLs or logs }
        expires_on: { type: string, format: date, description: Original UTC consent day plus 30 days; retries never extend this }
    ContributionSummary:
      type: object
      additionalProperties: false
      required: [schema_version, detector_version, calibrated, revision_id, segment_id, mode, direction, observation_period, qualified_passages, sustained_departure_rejoins]
      properties:
        schema_version: { type: integer, const: 1 }
        detector_version: { type: string, const: uncalibrated-v1 }
        calibrated: { type: boolean, const: false, description: Reference output only; not field qualification or independent corroboration }
        revision_id: { type: string, format: uuid }
        segment_id: { type: string, minLength: 1, maxLength: 120 }
        mode: { $ref: "#/components/schemas/TravelMode" }
        direction: { type: string, enum: [forward, reverse] }
        observation_period: { type: string, format: date, description: One UTC day within the last 30 days, no earlier than the retained consent day; precise trip timestamps are rejected }
        qualified_passages: { type: integer, const: 1 }
        sustained_departure_rejoins: { type: integer, minimum: 0, maximum: 1 }
    ContributionRequest:
      type: object
      additionalProperties: false
      required: [consent_id, summary]
      properties:
        consent_id: { type: string, format: uuid }
        summary: { $ref: "#/components/schemas/ContributionSummary" }
    ContributionReceipt:
      type: object
      required: [id, expires_on]
      properties:
        id: { type: string, format: uuid }
        expires_on: { type: string, format: date, description: No later than the original consent expiry or observation day plus 30 days }
    ContributionWithdrawal:
      type: object
      additionalProperties: false
      required: [consent_id, deletion_handle]
      properties:
        consent_id: { type: string, format: uuid }
        deletion_handle: { type: string, minLength: 64, maxLength: 64 }
    DraftCandidateRequest:
      type: object
      additionalProperties: false
      required: [evidence_ids]
      properties:
        evidence_ids: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { type: string, format: uuid } }
    DraftCitation:
      type: object
      required: [evidence_id, passage, quote]
      properties:
        evidence_id: { type: string, format: uuid }
        passage: { type: string, description: Exact reference from the offered immutable snapshot }
        quote: { type: string, minLength: 1, maxLength: 300, description: Exact substring of the offered passage; traceability does not certify that it entails a claim }
    HistoricalDraft:
      type: object
      required: [title, body, date_start, date_end, date_precision, date_display, topic_ids, sources, notes, title_citations, date_citations, claims, uncertainties, evidence_manifest, generated_at, base_payload_sha256, review_gaps]
      description: Private generated proposal. Body equals cited claim paragraphs joined by two newlines. Selected excerpts total at most 12000 runes; each provider draft is at most 32 KiB. At most five proposals and 256 KiB of candidate payload are retained. A curator must inspect factual meaning and copying rights.
      properties:
        title: { type: string, maxLength: 160 }
        body: { type: string, maxLength: 12000 }
        date_start: { type: string }
        date_end: { type: string }
        date_precision: { type: string, enum: [day, month, year, circa] }
        date_display: { type: string }
        topic_ids: { type: array, items: { type: string, format: uuid } }
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
        notes: { type: string, maxLength: 4000 }
        title_citations: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/DraftCitation" } }
        date_citations: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/DraftCitation" }, description: Required when any date/display is supplied }
        claims:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            properties:
              text: { type: string, maxLength: 2000 }
              kind: { type: string, enum: [fact, testimony] }
              attribution: { type: string, maxLength: 200, description: Testimony must name its attribution within text }
              citations: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/DraftCitation" } }
        uncertainties:
          type: array
          maxItems: 8
          items:
            type: object
            properties:
              kind: { type: string, enum: [conflicting_dates, research_gap] }
              text: { type: string, maxLength: 1000 }
              citations: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/DraftCitation" } }
          description: Conflicting dates require two distinct passage references and empty date/display fields with circa precision. They remain unresolved for review.
        evidence_manifest:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              url: { type: string, format: uri }
              title: { type: string }
              publisher: { type: string }
              outcome: { type: string, enum: [inspected_page, catalog_only] }
              retrieved_at: { type: string, format: date-time }
              content_sha256: { type: string }
        generated_at: { type: string, format: date-time }
        base_payload_sha256: { type: string }
        review_gaps: { type: array, items: { type: string } }
    CorridorSource:
      type: object
      additionalProperties: false
      required: [url, title, publisher, version, retrieved_on, license, license_url]
      description: Submitted reference attribution and source version; a URL or license label is not proof of field inspection or access. Curators must review copying rights before releasing reference geometry. Notes are public after publication; keep private rationale in the review note.
      properties:
        url: { type: string, format: uri, maxLength: 2000 }
        title: { type: string, minLength: 1, maxLength: 300 }
        publisher: { type: string, minLength: 1, maxLength: 200 }
        version: { type: string, minLength: 1, maxLength: 100 }
        retrieved_on: { type: string, format: date }
        license: { type: string, minLength: 1, maxLength: 100 }
        license_url: { type: string, format: uri, maxLength: 2000 }
        note: { type: string, maxLength: 1000 }
    ReferenceLine:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates: { type: array, minItems: 2, maxItems: 5000, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }, description: "Finite WGS84 [longitude, latitude] pairs; total across the import is at most 5000" }
    CorridorSegment:
      type: object
      additionalProperties: false
      required: [id, kind, from_node, to_node, branches, modes, geometry]
      description: Explicit endpoint node identities define connections. Endpoints sharing a node must agree within 20 m. Equal/near coordinates or geometry crossings never create a shared node. Road connectors require their own source context.
      properties:
        surface: { type: string, maxLength: 80, description: Optional sourced surface assertion; omitted means unknown }
        id: { type: string, minLength: 1, maxLength: 100 }
        kind: { type: string, enum: [trail, road_connector] }
        from_node: { type: string, minLength: 1, maxLength: 100 }
        to_node: { type: string, minLength: 1, maxLength: 100 }
        branches: { type: array, minItems: 1, maxItems: 8, items: { type: string, minLength: 1, maxLength: 100 } }
        modes: { type: array, maxItems: 2, uniqueItems: true, items: { $ref: "#/components/schemas/TravelMode" }, description: "Explicit independently allowed modes; empty is unresolved and cannot be selected" }
        geometry: { $ref: "#/components/schemas/ReferenceLine" }
        source: { $ref: "#/components/schemas/CorridorSource", nullable: true }
        network: { $ref: "#/components/schemas/CorridorNetwork" }
        access: { type: array, maxItems: 2, items: { $ref: "#/components/schemas/CorridorAccess" } }
    CorridorNetwork:
      type: object
      additionalProperties: false
      required: [ways, from_node_id, to_node_id]
      description: Reviewed network identity assertions oriented with the segment. Source inspection is retained privately with the proposal; identity labels alone cannot pass quality.
      properties:
        ways:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: integer, format: int64, minimum: 1 }
              reverse: { type: boolean, default: false, description: Against the OSM way's digitized direction }
        from_node_id: { type: integer, format: int64, minimum: 1 }
        to_node_id: { type: integer, format: int64, minimum: 1 }
    CorridorAccess:
      type: object
      additionalProperties: false
      required: [mode, status]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        status: { type: string, enum: [unknown, allowed, restricted, closed] }
        notes: { type: string, maxLength: 1000 }
    CorridorEvidenceRef:
      type: object
      additionalProperties: false
      required: [segment_id, purpose, evidence_id, reference, quote]
      description: Private exact citation to an existing completed inspected-page snapshot. Access requires mode; network purpose omits mode. Catalogue metadata and source URLs alone cannot qualify.
      properties:
        segment_id: { type: string }
        purpose: { type: string, enum: [network, access] }
        mode: { $ref: "#/components/schemas/TravelMode" }
        evidence_id: { type: string, format: uuid }
        reference: { type: string }
        quote: { type: string, minLength: 1, maxLength: 300 }
    PathQualityIssue:
      type: object
      required: [code, severity, origin, detail]
      properties:
        code: { type: string }
        severity: { type: string, enum: [blocked, needs_research, information] }
        origin: { type: string, enum: [inspected_source, provider_assertion, curator_assertion, unknown] }
        segment_id: { type: string }
        detail: { type: string }
    PathQualitySummary:
      type: object
      required: [version, status, issues, checked_at, input_current]
      description: Passing quality makes computed travel eligible for curator review; it is not publication approval or field/access certification. Existing immutable legacy revisions may omit quality. Input freshness is captured in frozen summaries and evaluated on read for working reports.
      properties:
        report_id: { type: string, format: uuid }
        version: { type: integer, enum: [1] }
        status: { type: string, enum: [pass, needs_research, blocked] }
        issues: { type: array, maxItems: 512, items: { $ref: "#/components/schemas/PathQualityIssue" } }
        checked_at: { type: string, format: date-time }
        input_current: { type: boolean }
    PathInspection:
      type: object
      required: [segment_id, purpose, evidence_id, reference, quote, url, content_sha256, retrieved_at]
      properties:
        segment_id: { type: string }
        purpose: { type: string, enum: [network, access] }
        mode: { $ref: "#/components/schemas/TravelMode" }
        evidence_id: { type: string, format: uuid }
        reference: { type: string }
        quote: { type: string, maxLength: 300 }
        url: { type: string, format: uri }
        content_sha256: { type: string }
        retrieved_at: { type: string, format: date-time }
    PathEdge:
      type: object
      description: Provider assertions, not independently inspected source facts
      properties:
        id: { type: integer, format: int64 }
        way_id: { type: integer, format: int64 }
        begin_node_id: { type: integer, format: int64 }
        end_node_id: { type: integer, format: int64 }
        forward: { type: boolean }
        use: { type: string }
        traversability: { type: string }
        travel_mode: { type: string }
        bridge: { type: boolean }
        tunnel: { type: boolean }
        begin_shape_index: { type: integer }
        end_shape_index: { type: integer }
    PathAttribution:
      type: object
      required: [provider, method]
      properties:
        provider: { type: string }
        method: { type: string, enum: [trace_attributes/edge_walk] }
        failure: { type: string, description: Explicit bounded outcome; no replacement path or map-snap result is accepted }
        legs:
          type: array
          nullable: true
          maxItems: 30
          items:
            type: object
            properties:
              geometry: { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }
              edges: { type: array, items: { $ref: "#/components/schemas/PathEdge" } }
              osm_changeset: { type: integer, format: int64 }
    PathQualityReport:
      allOf:
        - { $ref: "#/components/schemas/PathQualitySummary" }
        - type: object
          required: [input_hash, route_sha256, mode, provider, inspections]
          description: Private retained checkpoint. Public route summaries omit inspection identifiers/excerpts and detailed provider attribution. Quotes prove traceability rather than semantic support.
          properties:
            input_hash: { type: string }
            route_sha256: { type: string, description: SHA-256 of the exact computed result excluding bookkeeping fields }
            mode: { $ref: "#/components/schemas/TravelMode" }
            provider: { type: string }
            inspections: { type: array, maxItems: 192, items: { $ref: "#/components/schemas/PathInspection" } }
            attribution: { $ref: "#/components/schemas/PathAttribution" }
    CorridorTraversal:
      type: object
      additionalProperties: false
      required: [segment_id]
      properties:
        segment_id: { type: string }
        reverse: { type: boolean, default: false }
    ShapingPoint:
      type: object
      additionalProperties: false
      required: [id, segment_id, after_stop_id, before_stop_id, latitude, longitude]
      description: Routing intent only; creates no exhibit or arrival event. Ties a selected traversal occurrence to adjacent ordered stable story-stop IDs. Must be within 50 m of its selected reference segment. Arrays follow traversal/itinerary order.
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        segment_id: { type: string }
        traversal_index: { type: integer, minimum: 0, maximum: 63, default: 0 }
        after_stop_id: { type: string, format: uuid }
        before_stop_id: { type: string, format: uuid }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        note: { type: string, maxLength: 500 }
    ModeCorridor:
      type: object
      additionalProperties: false
      required: [mode, branch, direction, path]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        branch: { type: string, minLength: 1, maxLength: 100 }
        direction: { type: string, minLength: 1, maxLength: 100, description: "Explicit direction in the submitted reference; path traversals record actual orientation" }
        path: { type: array, minItems: 1, maxItems: 64, items: { $ref: "#/components/schemas/CorridorTraversal" }, description: "Connected by explicit node IDs; segments may repeat with an explicit traversal occurrence" }
        allowed_connectors: { type: array, maxItems: 16, uniqueItems: true, items: { type: string }, description: "Explicit sourced road connector IDs allowed for this branch/mode; no inferred adjacent roads" }
        shaping_points: { type: array, maxItems: 60, items: { $ref: "#/components/schemas/ShapingPoint" } }
    CorridorIntent:
      type: object
      additionalProperties: false
      required: [key, name, source, segments, routes]
      properties:
        key: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 300 }
        source: { $ref: "#/components/schemas/CorridorSource" }
        segments: { type: array, minItems: 1, maxItems: 64, items: { $ref: "#/components/schemas/CorridorSegment" } }
        routes: { type: array, minItems: 1, maxItems: 2, items: { $ref: "#/components/schemas/ModeCorridor" }, description: "At most one independent selection per tour mode; no fallback from another mode" }
    CorridorProposalRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: Supply a non-null intent or explicit remove=true with null/omitted intent. The proposal captures the tour draft version server-side and keeps immutable input.
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        intent: { $ref: "#/components/schemas/CorridorIntent", nullable: true }
        remove: { type: boolean, default: false }
        quality_evidence: { type: array, maxItems: 192, items: { $ref: "#/components/schemas/CorridorEvidenceRef" }, description: Private retained inspection references; omitted on public intent and may be omitted from metadata lists }
    CorridorReviewRequest:
      type: object
      additionalProperties: false
      required: [version, action, note]
      properties:
        version: { type: integer, format: int64, minimum: 0, description: "The proposal base_version; approval also compares its captured draft_version" }
        action: { type: string, enum: [approve, reject] }
        note: { type: string, minLength: 1, maxLength: 4000, description: "Private rationale; review topology and reference copying/access context before approval" }
    ApprovedCorridor:
      type: object
      required: [id, version, intent, content_sha256, reviewed_at]
      description: Public only inside a released tour snapshot; author IDs and private review notes are excluded. An approved removal has null intent but retains its version.
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 1 }
        intent: { $ref: "#/components/schemas/CorridorIntent", nullable: true }
        content_sha256: { type: string, description: "SHA-256 of canonical typed intent JSON; null for removal is hashed as JSON null" }
        reviewed_at: { type: string, format: date-time }
    CorridorProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        base_version: { type: integer, format: int64, minimum: 0 }
        draft_version: { type: integer, format: int64, minimum: 0 }
        intent: { $ref: "#/components/schemas/CorridorIntent", nullable: true }
        remove: { type: boolean }
        quality_evidence: { type: array, maxItems: 192, items: { $ref: "#/components/schemas/CorridorEvidenceRef" }, description: Private retained inspection references; omitted on public intent and may be omitted from metadata lists }
        content_sha256: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        created_by: { type: string, format: uuid }
        reviewed_by: { type: string, format: uuid, nullable: true }
        review_note: { type: string }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
    ApproveRouteCorrectionRequest:
      type: object
      additionalProperties: false
      required: [version, investigation_id, note]
      properties:
        version: { type: string, minLength: 64, maxLength: 64 }
        investigation_id: { type: string, format: uuid }
        note: { type: string, minLength: 1, maxLength: 2000 }
        temporary: { type: boolean, default: false }
        review_on: { type: string, format: date, nullable: true, description: Required for temporary corrections; a first approval needs a future date within one year }
    RouteCorrectionComparison:
      type: object
      required: [version, report, investigation, before, prepared, path_reports, potentially_affected_tours, blockers, ready_to_publish]
      properties:
        version: { type: string }
        report: { $ref: "#/components/schemas/RouteReport" }
        investigation: { $ref: "#/components/schemas/RouteInvestigation" }
        before: { $ref: "#/components/schemas/TourRevision" }
        prepared: { $ref: "#/components/schemas/TourSnapshot" }
        path_reports: { type: object, additionalProperties: { $ref: "#/components/schemas/PathQualityReport" } }
        potentially_affected_tours: { type: array, maxItems: 201, items: { type: string, format: uuid }, description: Exact shared stop-place or selected reviewed OSM-way references; private leads requiring manual assessment. More than 200 blocks release. }
        blockers: { type: array, items: { type: string } }
        ready_to_publish: { type: boolean }
    RouteCorrectionOutcome:
      type: object
      required: [revision_id, previous_revision_id, temporary, review_on, reassessment_required]
      properties:
        revision_id: { type: string, format: uuid }
        previous_revision_id: { type: string, format: uuid }
        temporary: { type: boolean }
        review_on: { type: string, format: date, nullable: true }
        reassessment_required: { type: boolean }
    RouteCorrection:
      allOf:
        - { $ref: "#/components/schemas/RouteCorrectionOutcome" }
        - type: object
          required: [id, report_id, investigation_id, tour_id, comparison_version, corridor_id, reviewed_by, note, potentially_affected_tours, created_at]
          properties:
            id: { type: string, format: uuid }
            report_id: { type: string, format: uuid }
            investigation_id: { type: string, format: uuid }
            tour_id: { type: string, format: uuid }
            comparison_version: { type: string }
            corridor_id: { type: string, format: uuid }
            reviewed_by: { type: string, format: uuid }
            note: { type: string }
            potentially_affected_tours: { type: array, items: { type: string, format: uuid } }
            created_at: { type: string, format: date-time }
    RouteInvestigationRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        related_report_ids: { type: array, maxItems: 19, uniqueItems: true, items: { type: string, format: uuid } }
        research: { $ref: "#/components/schemas/RouteBriefInput", description: Optional new place or historical leads; enters the existing private sourcing workflow, never public story text }
    InvestigationObservation:
      type: object
      required: [report]
      properties:
        report: { $ref: "#/components/schemas/RouteReport" }
        duplicate_of: { type: string, format: uuid, description: Conservative transitive group sharing an account, normalized source URL or matching submitted content; never a count of independent witnesses }
    RouteInvestigationInput:
      type: object
      required: [observations, brief_id, evidence_ids]
      properties:
        observations: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/InvestigationObservation" } }
        brief_id: { type: string, format: uuid }
        evidence_ids: { type: array, maxItems: 20, items: { type: string, format: uuid } }
        research: { $ref: "#/components/schemas/RouteBriefInput" }
    RouteInvestigationResult:
      type: object
      required: [status, comparison_direction, before, after, distance_change_m, duration_change_s, affected_stop_ids, arrivals, evidence, issues, stories_preserved, independent_corroboration, checked_at]
      properties:
        status: { type: string, enum: [review, needs_research] }
        comparison_direction: { type: string, const: published, description: The retained published direction; reverse and unknown report directions remain explicit review questions }
        before: { $ref: "#/components/schemas/TourRoute" }
        after: { $ref: "#/components/schemas/TourRoute", nullable: true, description: Private computed proposal replacing only affected legs; null if no complete proposal is available }
        distance_change_m: { type: number, nullable: true, description: Signed proposed total minus retained total; null without a complete alternative }
        duration_change_s: { type: integer, nullable: true }
        affected_stop_ids: { type: array, items: { type: string, format: uuid } }
        arrivals: { type: array, items: { $ref: "#/components/schemas/ArrivalSelection" }, description: Frozen mode-specific eligibility; a reported entrance is not promoted to an approved arrival }
        reviewed_corridor: { $ref: "#/components/schemas/ApprovedCorridor", description: Retained mode/access reference, when present }
        evidence: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/SourceEvidence" } }
        quality: { $ref: "#/components/schemas/PathQualityReport" }
        issues: { type: array, items: { $ref: "#/components/schemas/PathQualityIssue" } }
        stories_preserved: { type: boolean, const: true }
        independent_corroboration: { type: boolean, const: false }
        checked_at: { type: string, format: date-time }
    RouteInvestigation:
      type: object
      required: [id, report_id, job_id, created_by, input, result, created_at]
      properties:
        id: { type: string, format: uuid }
        report_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        input: { $ref: "#/components/schemas/RouteInvestigationInput" }
        result: { $ref: "#/components/schemas/RouteInvestigationResult", nullable: true }
        created_at: { type: string, format: date-time }
    ReportLocation:
      type: object
      additionalProperties: false
      required: [kind]
      description: Stop/entrance needs stop_id only, with optional arrival_id for a recorded entrance. Segment needs from_stop_id and to_stop_id from adjacent positions or a declared closing leg in this snapshot; forward/reverse direction must agree. Unknown direction prefers the submitted endpoint order. Unknown entrances need no approved arrival_id.
      properties:
        kind: { type: string, enum: [stop, entrance, segment] }
        stop_id: { type: string, format: uuid }
        arrival_id: { type: string, format: uuid }
        from_stop_id: { type: string, format: uuid }
        to_stop_id: { type: string, format: uuid }
    RouteReportInput:
      type: object
      additionalProperties: false
      required: [tour_id, revision_id, mode, affected, reason]
      properties:
        tour_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid, description: The immutable revision the visitor saw, not today's draft }
        mode: { $ref: "#/components/schemas/TravelMode" }
        direction: { type: string, enum: [forward, reverse, unknown], default: unknown }
        affected: { $ref: "#/components/schemas/ReportLocation" }
        reason: { type: string, enum: [blocked, closed, unsafe, access, surface, improvement, other] }
        details: { type: string, maxLength: 4000, description: Private operational observation; required for other }
        observed_on: { type: string, format: date, nullable: true, description: Omit or null when the observation date is unknown }
        duration: { type: string, enum: [permanent, temporary, unknown], default: unknown }
        better: { type: string, maxLength: 1000, description: "What improves, such as safety or surface; required for improvement" }
        source_url: { type: string, maxLength: 2000, description: Optional HTTP(S) reference without credentials; never fetched by this API }
        annotation:
          type: object
          nullable: true
          additionalProperties: false
          required: [lat, lng]
          description: One affected-location point within 1 km of the selected frozen stop/entrance/segment; no background trip trace
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
        alternative:
          type: object
          nullable: true
          additionalProperties: false
          required: [type, coordinates]
          description: Optional unverified local suggestion. Every point stays within 1 km of the affected frozen path. For a segment, ends connect within 100 m of its ordered endpoints. For a stop/entrance, at least one end connects within 100 m. Proximity does not prove access or traversability.
          properties:
            type: { type: string, enum: [LineString] }
            coordinates: { type: array, minItems: 2, maxItems: 64, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }, description: "WGS84 [longitude, latitude] pairs" }
    RouteReport:
      type: object
      required: [id, owner_account_id, submitted, status, reason, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_account_id: { type: string, format: uuid, readOnly: true, description: Derived from the authenticated session }
        submitted: { $ref: "#/components/schemas/RouteReportInput" }
        status: { $ref: "#/components/schemas/BriefStatus" }
        reason: { type: string, description: Private disposition reason visible to the submitter and curators }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PublishRevisionRequest:
      type: object
      additionalProperties: false
      required: [draft_version, current_revision_id]
      properties:
        draft_version: { type: integer, format: int64, minimum: 0 }
        current_revision_id: { type: string, format: uuid, nullable: true, description: Null before first release; compare the current published pointer as well as the working draft }
    TourSnapshot:
      type: object
      required: [tour, moments, routes, routing_intent]
      properties:
        tour: { $ref: "#/components/schemas/TourDetail" }
        moments: { type: object, additionalProperties: { $ref: "#/components/schemas/MomentDetail" }, description: Full reviewed selected stories and source/media metadata as captured at release }
        routes: { type: object, additionalProperties: { $ref: "#/components/schemas/TourRoute" } }
        routing_intent:
          type: object
          properties:
            modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
            coordinate_source: { type: string, enum: [historical_site, approved_navigation], description: Approved navigation uses reviewed arrival coordinates; site coordinates remain separate context }
            corridor:
              type: object
              description: Optional released intent reference; full reference geometry and mode choices are in tour.corridor. Does not claim current generated geometry follows this intent.
              required: [id, version, content_sha256]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, format: int64, minimum: 1 }
                content_sha256: { type: string }
            stops: { type: array, items: { type: object, properties: { stop_id: { type: string }, place_id: { type: string }, latitude: { type: number }, longitude: { type: number }, site_latitude: { type: number, description: Present for approved navigation }, site_longitude: { type: number, description: Present for approved navigation }, arrival_point: { $ref: "#/components/schemas/ApprovedArrival", nullable: true } } } }
    TourRevision:
      type: object
      required: [id, tour_id, number, draft_version, published_at]
      properties:
        id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        number: { type: integer, format: int64, minimum: 1 }
        draft_version: { type: integer, format: int64, minimum: 0 }
        published_at: { type: string, format: date-time }
        snapshot: { $ref: "#/components/schemas/TourSnapshot", description: Omitted on the paginated metadata list }
    RevisionProgressRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        visited_stop_ids: { type: array, maxItems: 30, items: { type: string, format: uuid }, description: Stable IDs from this revision's stops }
        completed: { type: boolean, default: false }
        reset: { type: boolean, default: false }
    RevisionProgress:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/TravelMode" }
        visited_stop_ids: { type: array, items: { type: string, format: uuid } }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    ArrivalAccess:
      type: object
      additionalProperties: false
      required: [mode, status, surface]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        status: { type: string, enum: [unknown, allowed, restricted, closed] }
        surface: { type: string, enum: [unknown, paved, unpaved, mixed, steps, other] }
        source_url: { type: string, maxLength: 2000, description: HTTP/HTTPS reference without credentials; not fetched by this API }
        source_title: { type: string, maxLength: 500 }
        retrieved_at: { type: string, description: YYYY-MM-DD; cannot be in the future }
        notes: { type: string, maxLength: 2000 }
    ArrivalPoint:
      type: object
      additionalProperties: false
      required: [name, kind, latitude, longitude, access]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        kind: { type: string, enum: [entrance, viewpoint] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        access: { type: array, minItems: 2, maxItems: 2, items: { $ref: "#/components/schemas/ArrivalAccess" }, description: Exactly one walk and one bike assessment; known access/surface requires source URL, title and retrieval date }
        notes: { type: string, maxLength: 4000, description: Public location/context notes after approval; no accessibility guarantee }
    ArrivalProposalRequest:
      type: object
      additionalProperties: false
      required: [version, point]
      properties:
        version: { type: integer, minimum: 0 }
        point: { $ref: "#/components/schemas/ArrivalPoint" }
    ArrivalReviewRequest:
      type: object
