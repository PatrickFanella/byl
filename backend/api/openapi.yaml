openapi: 3.1.0
info:
  title: Invisible Museum API
  version: "1.0.0"
  description: >
    Walking and biking tours of a city as if it were one museum. One API for the
    iOS, Android, and web clients.
servers:
  - url: https://museum-api.subcult.tv
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness and database check
      responses:
        "200":
          description: OK
        "503":
          description: Database unreachable
  /t/{slug}:
    get:
      summary: Landing page for a shared route link that hands off to the app's URL scheme
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "HTML page linking to invisiblemuseum://tour/{slug}"
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Malformed slug
  /api/v1/cities:
    get:
      summary: List cities
      responses: { "200": { description: OK } }
  /api/v1/cities/{city}:
    get:
      summary: Get a city with its topics
      parameters: [{ name: city, in: path, required: true, schema: { type: string }, description: City id or slug }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/cities/{city}/places:
    get:
      summary: List published places in a city
      parameters:
        - { name: city, in: path, required: true, schema: { type: string } }
        - { name: near, in: query, schema: { type: string }, description: "lat,lng; sorts by distance and adds distance_m" }
        - { name: radius_m, in: query, schema: { type: integer, default: 2000, maximum: 50000 } }
        - { name: bbox, in: query, schema: { type: string }, description: "minLng,minLat,maxLng,maxLat" }
        - { name: topic, in: query, schema: { type: string }, description: Topic id or slug }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/cities/{city}/tours:
    get:
      summary: List public published tours in a city
      parameters:
        - { name: city, in: path, required: true, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [walk, bike] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/places/{place}:
    get:
      summary: Get a published place with its published moments
      parameters:
        - { name: place, in: path, required: true, schema: { type: string }, description: "Place id, or slug with ?city=" }
        - { name: city, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/places/{place}/moments:
    get:
      summary: List a place's published moments in date order
      parameters:
        - { name: place, in: path, required: true, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/moments/{id}:
    get:
      summary: Get a published moment with body, media, sources, topics, and narration
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/topics/{id}:
    get:
      summary: Get a topic
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Topic id, or slug with ?city=" }
        - { name: city, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/tours/{tour}:
    get:
      summary: Get a tour with stops, featured moments, and route summaries
      description: Public and unlisted published tours are visible to everyone; private tours only to their owner; unpublished tours to their owner and curators.
      parameters: [{ name: tour, in: path, required: true, schema: { type: string }, description: Tour id or slug }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/tours/{tour}/route:
    get:
      summary: Get the full route geometry for a mode
      parameters:
        - { name: tour, in: path, required: true, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [walk, bike], default: walk } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/media/{id}:
    get:
      summary: Get media asset metadata
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/auth/dev:
    get:
      summary: Check whether development sign-in is enabled
      responses: { "200": { description: Development authentication availability } }
    post:
      summary: Development-only email sign-in
      description: Only served when DEV_AUTH_ENABLED=true; returns 404 otherwise.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string }, display_name: { type: string } } } } } }
      responses: { "200": { description: Session }, "404": { description: Disabled }, "422": { description: Validation failed } }
  /api/v1/auth/apple:
    post:
      summary: Exchange a Sign in with Apple identity token for a session
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identity_token], properties: { identity_token: { type: string }, display_name: { type: string } } } } } }
      responses: { "200": { description: Session }, "401": { description: Token rejected }, "503": { description: Provider not configured } }
  /api/v1/auth/google:
    post:
      summary: Exchange a Google ID token for a session
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id_token], properties: { id_token: { type: string } } } } } }
      responses: { "200": { description: Session }, "401": { description: Token rejected }, "503": { description: Provider not configured } }
  /api/v1/auth/session:
    delete:
      summary: Revoke the current session
      security: [{ bearer: [] }]
      responses: { "204": { description: Revoked }, "401": { description: Unauthorized } }
  /api/v1/me:
    get:
      summary: Current account
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
  /api/v1/me/tours:
    get:
      summary: List my routes
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned by the previous response }
      responses: { "200": { description: OK } }
    post:
      summary: Create a route from 2 to 30 published places in one city
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserTourRequest" } } } }
      responses: { "201": { description: Created, unlisted by default }, "404": { description: Unknown city }, "422": { description: Validation failed } }
  /api/v1/me/tours/{id}:
    get:
      summary: Get one of my routes
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not mine or not found } }
    patch:
      summary: Update title, summary, modes, visibility, or stops
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserTourRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not mine or not found }, "422": { description: Validation failed } }
    delete:
      summary: Delete one of my routes
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted }, "404": { description: Not mine or not found } }
  /api/v1/me/saved:
    get:
      summary: List saved tours
      security: [{ bearer: [] }]
      responses: { "200": { description: OK } }
  /api/v1/me/saved/{tour}:
    put:
      summary: Save a tour
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Saved }, "404": { description: Not found } }
    delete:
      summary: Unsave a tour
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed }, "404": { description: Not found } }
  /api/v1/me/progress:
    get:
      summary: List my progress on every tour
      security: [{ bearer: [] }]
      responses: { "200": { description: OK } }
  /api/v1/me/progress/{tour}:
    get:
      summary: Get my progress on a tour
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
    put:
      summary: Record my progress on a tour
      description: Atomically unions visited positions and preserves completion. Send reset=true without visited positions or completed=true to start over. Progress is shared across travel modes for this account and tour.
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProgressRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/admin/cities:
    get:
      summary: "List cities (any status)"
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Create a city"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCityRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/cities/{id}:
    patch:
      summary: "Update a city"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCityRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/topics:
    get:
      summary: "List a city's topics (?city= required)"
      parameters:
        - { name: city, in: query, required: true, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    post:
      summary: "Create a topic"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTopicRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/topics/{id}:
    patch:
      summary: "Update a topic"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTopicRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/places:
    get:
      summary: "List places in any status (?city=, ?limit=, ?cursor=)"
      parameters:
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Create a draft place"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePlaceRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/places/{id}:
    get:
      summary: "Get a place with all its moments"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    patch:
      summary: "Update a place, including its primary moment"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePlaceRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
    delete:
      summary: "Archive a place"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/places/{id}/media:
    put:
      summary: Replace ordered photos, documents and video references for a place
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaListRequest" } } } }
      responses:
        "200": { description: Updated place, content: { application/json: { schema: { $ref: "#/components/schemas/PlaceDetail" } } } }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Place or asset not found }
        "409": { description: Published place requires complete file rights or external reference metadata }
        "422": { description: Invalid attachment list }
  /api/v1/admin/places/{id}/publish:
    post:
      summary: "Publish a place with a published, illustrated and sourced primary history"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Primary history is missing or incomplete }, "401": { description: Unauthorized } }
  /api/v1/admin/places/{id}/unpublish:
    post:
      summary: "Return a place to draft"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/moments:
    get:
      summary: "List a place's moments in any status (?place= required, ?city=)"
      parameters:
        - { name: place, in: query, required: true, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    post:
      summary: "Create a draft moment with sources and topics"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateMomentRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}:
    get:
      summary: "Get a moment in any status"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    patch:
      summary: "Update a moment's text and dates"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMomentRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
    delete:
      summary: "Archive a moment"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/publish:
    post:
      summary: "Publish a sourced history of at least 250 words and three paragraphs with a credited reusable picture; enqueues narration"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Conflict }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/unpublish:
    post:
      summary: "Return a moment to draft"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/media:
    put:
      summary: "Replace the ordered media list"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaListRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/sources:
    put:
      summary: "Replace the ordered sources"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SourcesRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/topics:
    put:
      summary: "Replace the topic set"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TopicsRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/media:
    get:
      summary: "List media assets newest first (?limit=, ?offset=)"
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Upload a photo, PDF, plain-text document or audio file (64 MiB maximum); video uploads are disabled"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, caption: { type: string }, credit: { type: string }, license: { type: string }, license_url: { type: string }, source_url: { type: string } } } } } }
      responses: { "201": { description: Created }, "400": { description: Bad request }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/media/links:
    post:
      summary: Add an external video or document link without downloading or embedding it
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLinkRequest" } } } }
      responses:
        "201": { description: Created reference, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAsset" } } } }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "422": { description: Invalid kind, URL, title or creator }
  /api/v1/admin/media/{id}:
    patch:
      summary: "Update asset metadata and licence"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaMetadataRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/tours:
    get:
      summary: "List tours in any status and visibility (?city=)"
      parameters:
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Create a draft curated tour, optionally with stops"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTourRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}:
    get:
      summary: "Get a tour in any status"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    patch:
      summary: "Update a tour; changing modes adds or drops routes"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTourRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
    delete:
      summary: "Delete a tour"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: No content }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/stops:
    put:
      summary: "Replace the stop list and requeue routes"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StopsRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/publish:
    post:
      summary: "Publish a tour; refuses unless every place is published and every route is ready"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Conflict }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/unpublish:
    post:
      summary: "Return a tour to draft"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/routes/recompute:
    post:
      summary: "Mark routes pending and enqueue route jobs"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "202": { description: Accepted }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/candidates:
    get:
      summary: "List review-queue entries (?status=, ?kind=, ?origin=, ?source=, ?limit=, ?cursor=)"
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { type: string } }
        - { name: origin, in: query, required: false, schema: { type: string } }
        - { name: source, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
    post:
      summary: "Add a review-queue entry by hand"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCandidateRequest" } } } }
      responses: { "201": { description: Created }, "409": { description: Conflict }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/candidates/{id}:
    get:
      summary: "Get a review-queue entry"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/candidates/{id}/approve:
    post:
      summary: "Approve: creates the draft entity from the payload (optionally overridden) and records its id"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Conflict }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/candidates/{id}/reject:
    post:
      summary: "Reject with a note"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Conflict }, "401": { description: Unauthorized } }
  /api/v1/admin/jobs:
    get:
      summary: "List background jobs (?status=, ?limit=, ?offset=)"
      parameters:
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/jobs/{id}:
    get:
      summary: Get one job and its terminal result
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "403": { description: Forbidden } }
  /api/v1/admin/jobs/{id}/retry:
    post:
      summary: "Requeue a failed job"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/accounts:
    get:
      summary: "List accounts (admin only)"
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "403": { description: Forbidden }, "401": { description: Unauthorized } }
  /api/v1/admin/accounts/{id}/role:
    patch:
      summary: "Change an account's role (admin only)"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RoleRequest" } } } }
      responses: { "200": { description: OK }, "403": { description: Forbidden }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/sources:
    get:
      summary: "List source adapters with their capabilities"
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
  /api/v1/admin/imports:
    post:
      summary: "Queue an import from a source around a city, a place, or a point"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ImportRequest" } } } }
      responses: { "202": { description: Job queued }, "404": { description: Unknown city or place }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/candidates/{id}/draft:
    post:
      summary: "Queue an LLM draft for a pending moment candidate"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "202": { description: Job queued }, "404": { description: Not found }, "409": { description: Not a pending moment candidate }, "503": { description: No LLM provider configured }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/stops/{position}/suggest:
    post:
      summary: "Rank a stop's published moments against the tour topic"
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: position, in: path, required: true, schema: { type: integer } }
      responses: { "200": { description: Ordered suggestions }, "404": { description: Not found }, "409": { description: Tour has no topic }, "502": { description: LLM failed }, "503": { description: No LLM provider configured }, "401": { description: Unauthorized } }
  /api/v1/admin/stats:
    get:
      summary: "Dashboard counts"
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque session token from one of the /auth endpoints.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, validation_failed, unauthorized, forbidden, not_found, conflict, unavailable, internal] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    List:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: string, description: Empty when there is no further page }
    City:
      type: object
      required: [id, slug, name, region, country_code, center_lat, center_lng, bbox, timezone, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        country_code: { type: string }
        center_lat: { type: number }
        center_lng: { type: number }
        bbox: { type: object, properties: { min_lat: { type: number }, min_lng: { type: number }, max_lat: { type: number }, max_lng: { type: number } } }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CityDetail:
      allOf:
        - $ref: "#/components/schemas/City"
        - type: object
          properties:
            topics: { type: array, items: { $ref: "#/components/schemas/Topic" } }
    Topic:
      type: object
      required: [id, city_id, slug, name, description, moment_count]
      properties:
        id: { type: string, format: uuid }
        city_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        moment_count: { type: integer, description: Published moments carrying this topic }
    MediaAsset:
      type: object
      required: [id, kind, external, public_url, mime_type, caption, credit, license, license_url, source_url, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [image, video, audio, document] }
        external: { type: boolean, description: True for references opened at the source; never downloaded or embedded }
        storage_key: { type: string, readOnly: true, description: Blob-store key; empty until an imported asset is fetched }
        public_url: { type: string, format: uri }
        mime_type: { type: string }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_seconds: { type: number, nullable: true }
        caption: { type: string }
        credit: { type: string }
        license: { type: string, description: "Licence identifier such as CC-BY-4.0, CC0-1.0, PD-US, all-rights-reserved" }
        license_url: { type: string }
        source_url: { type: string }
        status: { $ref: "#/components/schemas/EntityStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntityStatus:
      type: string
      enum: [draft, in_review, published, archived]
    TravelMode:
      type: string
      enum: [walk, bike]
    PlaceSummary:
      type: object
      required: [id, city_id, slug, name, summary, kind, latitude, longitude, arrival_radius_m, address, status, moment_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        city_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        kind: { type: string, description: "building, park, street, station, monument, site, or free text" }
        latitude: { type: number }
        longitude: { type: number }
        arrival_radius_m: { type: number }
        address: { type: string }
        status: { $ref: "#/components/schemas/EntityStatus" }
        primary_moment_id: { type: string, format: uuid, nullable: true }
        moment_count: { type: integer }
        distance_m: { type: number, description: "Only present on ?near= queries" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlaceDetail:
      allOf:
        - $ref: "#/components/schemas/PlaceSummary"
        - type: object
          properties:
            primary_moment: { $ref: "#/components/schemas/MomentSummary", nullable: true }
            moments: { type: array, items: { $ref: "#/components/schemas/MomentSummary" } }
            media: { type: array, items: { $ref: "#/components/schemas/MediaAsset" } }
    Source:
      type: object
      required: [title]
      properties:
        title: { type: string }
        url: { type: string }
        publisher: { type: string }
        retrieved_at: { type: string, format: date, nullable: true }
        license: { type: string }
        note: { type: string }
    MomentSummary:
      type: object
      required: [id, place_id, slug, title, excerpt, date_precision, date_display, has_narration, status, topic_ids]
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        date_start: { type: string, format: date, nullable: true }
        date_end: { type: string, format: date, nullable: true }
        date_precision: { type: string, enum: [day, month, year, circa] }
        date_display: { type: string }
        hero_media: { $ref: "#/components/schemas/MediaAsset", nullable: true }
        has_narration: { type: boolean }
        status: { $ref: "#/components/schemas/EntityStatus" }
        topic_ids: { type: array, items: { type: string, format: uuid } }
    MomentDetail:
      allOf:
        - $ref: "#/components/schemas/MomentSummary"
        - type: object
          properties:
            body: { type: string, description: Markdown }
            media: { type: array, items: { $ref: "#/components/schemas/MediaAsset" } }
            sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
            topics: { type: array, items: { $ref: "#/components/schemas/Topic" } }
            narration: { $ref: "#/components/schemas/MediaAsset", nullable: true, description: "Audio asset; null means use on-device speech" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RouteSummary:
      type: object
      required: [mode, status, distance_m, duration_s]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        status: { type: string, enum: [pending, ready, failed] }
        distance_m: { type: number }
        duration_s: { type: integer }
        estimated_minutes: { type: integer, nullable: true, description: Present only when status is ready }
        error: { type: string }
        computed_at: { type: string, format: date-time, nullable: true }
    RouteLeg:
      type: object
      required: [from_position, to_position, distance_m, duration_s, geometry]
      properties:
        from_position: { type: integer }
        to_position: { type: integer }
        distance_m: { type: number }
        duration_s: { type: integer }
        geometry: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }, description: "[lng, lat] pairs" }
    TourRoute:
      type: object
      required: [id, tour_id, mode, status, provider, distance_m, duration_s, legs]
      properties:
        id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/TravelMode" }
        status: { type: string, enum: [pending, ready, failed] }
        provider: { type: string }
        distance_m: { type: number }
        duration_s: { type: integer }
        geometry:
          nullable: true
          type: object
          description: GeoJSON LineString
          properties:
            type: { type: string, enum: [LineString] }
            coordinates: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
        legs: { type: array, items: { $ref: "#/components/schemas/RouteLeg" } }
        error: { type: string }
        computed_at: { type: string, format: date-time, nullable: true }
    TourSummary:
      type: object
      required: [id, city_id, slug, title, summary, modes, status, visibility, stop_count, routes, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        city_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        topic_id: { type: string, format: uuid, nullable: true }
        topic: { $ref: "#/components/schemas/Topic", nullable: true }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        hero_media: { $ref: "#/components/schemas/MediaAsset", nullable: true }
        status: { $ref: "#/components/schemas/EntityStatus" }
        visibility: { type: string, enum: [public, unlisted, private] }
        owner_account_id: { type: string, format: uuid, nullable: true, description: Set for user routes }
        stop_count: { type: integer }
        routes: { type: object, additionalProperties: { $ref: "#/components/schemas/RouteSummary" }, description: Keyed by mode }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TourStop:
      type: object
      required: [id, position, place, note]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, description: 1-based }
        place: { $ref: "#/components/schemas/PlaceSummary" }
        featured_moment_id: { type: string, format: uuid, nullable: true, description: Curator's explicit choice, or null }
        featured_moment: { $ref: "#/components/schemas/MomentSummary", nullable: true, description: The explicit choice or the place's primary moment }
        note: { type: string }
    TourDetail:
      allOf:
        - $ref: "#/components/schemas/TourSummary"
        - type: object
          properties:
            stops: { type: array, items: { $ref: "#/components/schemas/TourStop" } }
    TourProgress:
      type: object
      required: [account_id, tour_id, mode, visited_positions, started_at, updated_at]
      properties:
        account_id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/TravelMode" }
        visited_positions: { type: array, items: { type: integer } }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    Account:
      type: object
      required: [id, provider, email, display_name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [apple, google, dev] }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [visitor, curator, admin] }
        last_sign_in_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [token, expires_at, account]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
    Candidate:
      type: object
      required: [id, kind, origin, payload, status, review_note, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [place, moment, media] }
        origin: { type: string, enum: [import, draft, user] }
        source_name: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        submitted_by_account_id: { type: string, format: uuid, nullable: true }
        target_place_id: { type: string, format: uuid, nullable: true }
        target_moment_id: { type: string, format: uuid, nullable: true }
        payload: { type: object, description: Shaped like the create request for the kind }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewer_account_id: { type: string, format: uuid, nullable: true }
        review_note: { type: string }
        approved_entity_id: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, kind, payload, status, attempts, max_attempts, run_after, last_error, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [compute_route, generate_narration, import_source, draft_candidate, fetch_media] }
        payload: { type: object }
        status: { type: string, enum: [queued, running, done, failed] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        run_after: { type: string, format: date-time }
        last_error: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    StopInput:
      type: object
      required: [place_id]
      properties:
        place_id: { type: string, format: uuid }
        featured_moment_id: { type: string, format: uuid, nullable: true, description: Ignored for user routes }
        note: { type: string }
    CreateUserTourRequest:
      type: object
      required: [city, title, stops]
      properties:
        city: { type: string, description: City id or slug }
        title: { type: string }
        summary: { type: string }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" }, description: Defaults to both }
        visibility: { type: string, enum: [unlisted, private], default: unlisted }
        stops: { type: array, minItems: 2, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    UpdateUserTourRequest:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        visibility: { type: string, enum: [unlisted, private] }
        stops: { type: array, minItems: 2, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    ProgressRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        visited_positions: { type: array, items: { type: integer, minimum: 1 } }
        completed: { type: boolean }
        reset: { type: boolean, default: false, description: Explicitly clears visited positions and completion; cannot be combined with nonempty visited_positions or completed=true. }
    CreateCityRequest:
      type: object
      required: [name, center_lat, center_lng, bbox_min_lat, bbox_min_lng, bbox_max_lat, bbox_max_lng]
      properties:
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        country_code: { type: string, default: US }
        center_lat: { type: number }
        center_lng: { type: number }
        bbox_min_lat: { type: number }
        bbox_min_lng: { type: number }
        bbox_max_lat: { type: number }
        bbox_max_lng: { type: number }
        timezone: { type: string, default: America/Chicago }
    UpdateCityRequest:
      type: object
      properties:
        name: { type: string }
        region: { type: string }
        country_code: { type: string }
        center_lat: { type: number }
        center_lng: { type: number }
        bbox_min_lat: { type: number }
        bbox_min_lng: { type: number }
        bbox_max_lat: { type: number }
        bbox_max_lng: { type: number }
        timezone: { type: string }
    CreateTopicRequest:
      type: object
      required: [city_id, name]
      properties:
        city_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
    UpdateTopicRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
    CreatePlaceRequest:
      type: object
      required: [city_id, name, latitude, longitude]
      properties:
        city_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        kind: { type: string, default: site }
        latitude: { type: number }
        longitude: { type: number }
        arrival_radius_m: { type: number, default: 40, maximum: 500 }
        address: { type: string }
    UpdatePlaceRequest:
      type: object
      properties:
        name: { type: string }
        summary: { type: string }
        kind: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        arrival_radius_m: { type: number }
        address: { type: string }
        primary_moment_id: { type: string, format: uuid, description: Must belong to the place; empty string clears }
    CreateMomentRequest:
      type: object
      required: [place_id, title]
      properties:
        place_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        body: { type: string, description: Markdown }
        date_start: { type: string, format: date }
        date_end: { type: string, format: date }
        date_precision: { type: string, enum: [day, month, year, circa], default: year }
        date_display: { type: string }
        hero_media_id: { type: string, format: uuid, nullable: true }
        topic_ids: { type: array, items: { type: string, format: uuid } }
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
    UpdateMomentRequest:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        date_start: { type: string, format: date, description: Empty string clears }
        date_end: { type: string, format: date }
        date_precision: { type: string, enum: [day, month, year, circa] }
        date_display: { type: string }
        hero_media_id: { type: string, format: uuid, description: Empty string clears }
    MediaListRequest:
      type: object
      required: [media_ids]
      properties:
        media_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
    SourcesRequest:
      type: object
      required: [sources]
      properties:
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
    TopicsRequest:
      type: object
      required: [topic_ids]
      properties:
        topic_ids: { type: array, items: { type: string, format: uuid } }
    MediaLinkRequest:
      type: object
      required: [kind, public_url, caption, credit, source_url]
      properties:
        kind: { type: string, enum: [video, document] }
        public_url: { type: string, format: uri, description: Original http(s) watch or document URL }
        caption: { type: string, minLength: 1, description: Title and relevance to the place or event }
        credit: { type: string, minLength: 1, description: Creator or publisher }
        source_url: { type: string, format: uri }
    MediaMetadataRequest:
      type: object
      properties:
        caption: { type: string }
        credit: { type: string }
        license: { type: string }
        license_url: { type: string }
        source_url: { type: string }
    CreateTourRequest:
      type: object
      required: [city_id, title]
      properties:
        city_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        topic_id: { type: string, format: uuid, nullable: true }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        hero_media_id: { type: string, format: uuid, nullable: true }
        visibility: { type: string, enum: [public, unlisted, private], default: public }
        stops: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    UpdateTourRequest:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        topic_id: { type: string, format: uuid, description: Empty string clears }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        hero_media_id: { type: string, format: uuid, description: Empty string clears }
        visibility: { type: string, enum: [public, unlisted, private] }
    StopsRequest:
      type: object
      required: [stops]
      properties:
        stops: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    CreateCandidateRequest:
      type: object
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [place, moment, media] }
        origin: { type: string, enum: [import, draft, user], default: draft }
        source_name: { type: string, nullable: true }
        external_id: { type: string, nullable: true, description: "Unique with source_name; duplicates return 409" }
        target_place_id: { type: string, format: uuid, nullable: true }
        target_moment_id: { type: string, format: uuid, nullable: true }
        payload: { type: object }
    ReviewRequest:
      type: object
      properties:
        note: { type: string }
        payload: { type: object, description: Top-level keys overlaid on the stored payload before creating the entity }
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [visitor, curator, admin] }
    ImportRequest:
      type: object
      required: [source, city]
      properties:
        source: { type: string, description: Adapter name from /admin/sources }
        city: { type: string, description: City id or slug }
        place: { type: string, description: Place id or slug; centres the search and targets moment candidates }
        near: { type: string, description: "lat,lng; centres the search when no place is given" }
        radius_m: { type: number, maximum: 20000 }
        query: { type: string, description: Free text for query-based adapters }
        limit: { type: integer, maximum: 100 }
    Stats:
      type: object
      required: [pending_candidates, jobs, published, user_routes, accounts]
      properties:
        pending_candidates: { type: object, additionalProperties: { type: integer } }
        jobs: { type: object, additionalProperties: { type: integer } }
        published: { type: object, properties: { places: { type: integer }, moments: { type: integer }, tours: { type: integer } } }
        user_routes: { type: integer }
        accounts: { type: integer }
    Suggestion:
      type: object
      required: [moment, reason]
      properties:
        moment: { $ref: "#/components/schemas/MomentSummary" }
        reason: { type: string }
