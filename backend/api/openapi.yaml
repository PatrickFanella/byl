      responses: { "202": { description: Job queued with evidence IDs and payload hash only }, "400": { description: Malformed request }, "404": { description: Candidate or evidence not found }, "409": { description: Not a pending moment candidate }, "422": { description: Invalid or uninspected evidence }, "503": { description: No LLM provider configured }, "401": { description: Unauthorized }, "403": { description: Curator role required } }
