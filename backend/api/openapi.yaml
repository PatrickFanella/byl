openapi: 3.1.0
info:
  title: Invisible Museum API
  version: "1.0.0"
  description: >
    Walking and biking tours of a city as if it were one museum. One API for the
    iOS, Android, and web clients.
servers:
  - url: https://museum-api.subcult.tv
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness and database check
      responses:
        "200":
          description: OK
        "503":
          description: Database unreachable
  /t/{slug}:
    get:
      summary: Landing page for a shared route link that hands off to the app's URL scheme
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "HTML page linking to invisiblemuseum://tour/{slug}"
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Malformed slug
  /api/v1/cities:
    get:
      summary: List cities
      responses: { "200": { description: OK } }
  /api/v1/cities/{city}:
    get:
      summary: Get a city with its topics
      parameters: [{ name: city, in: path, required: true, schema: { type: string }, description: City id or slug }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/cities/{city}/places:
    get:
      summary: List published places in a city
      parameters:
        - { name: city, in: path, required: true, schema: { type: string } }
        - { name: near, in: query, schema: { type: string }, description: "lat,lng; sorts by distance and adds distance_m" }
        - { name: radius_m, in: query, schema: { type: integer, default: 2000, maximum: 50000 } }
        - { name: bbox, in: query, schema: { type: string }, description: "minLng,minLat,maxLng,maxLat" }
        - { name: topic, in: query, schema: { type: string }, description: Topic id or slug }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/cities/{city}/tours:
    get:
      summary: List public published tours in a city
      parameters:
        - { name: city, in: path, required: true, schema: { type: string } }
        - { name: topic, in: query, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [walk, bike] } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/places/{place}:
    get:
      summary: Get a published place with its published moments
      parameters:
        - { name: place, in: path, required: true, schema: { type: string }, description: "Place id, or slug with ?city=" }
        - { name: city, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/places/{place}/moments:
    get:
      summary: List a place's published moments in date order
      parameters:
        - { name: place, in: path, required: true, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/moments/{id}:
    get:
      summary: Get a published moment with body, media, sources, topics, and narration
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/topics/{id}:
    get:
      summary: Get a topic
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "Topic id, or slug with ?city=" }
        - { name: city, in: query, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/tours/{tour}:
    get:
      summary: Get a tour with stops, featured moments, and route summaries
      description: Public and unlisted published tours are visible to everyone; private tours only to their owner; unpublished tours to their owner and curators. Published reads serve the current immutable revision, or an authenticated legacy trip's pinned revision until progress reset. Attach the bearer token when resuming a trip. Editing endpoints return the working copy.
      parameters: [{ name: tour, in: path, required: true, schema: { type: string }, description: Tour id or slug }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/tours/{tour}/route:
    get:
      summary: Get the full route geometry for a mode
      description: Uses the same published or authenticated legacy trip revision as the tour read. Geometry in an existing revision does not change after recomputation.
      parameters:
        - { name: tour, in: path, required: true, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [walk, bike], default: walk } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/media/{id}:
    get:
      summary: Get media asset metadata
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /api/v1/auth/dev:
    get:
      summary: Check whether development sign-in is enabled
      responses: { "200": { description: Development authentication availability } }
    post:
      summary: Development-only email sign-in
      description: Only served when DEV_AUTH_ENABLED=true; returns 404 otherwise.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string }, display_name: { type: string } } } } } }
      responses: { "200": { description: Session }, "404": { description: Disabled }, "422": { description: Validation failed } }
  /api/v1/auth/apple:
    post:
      summary: Exchange a Sign in with Apple identity token for a session
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identity_token], properties: { identity_token: { type: string }, display_name: { type: string } } } } } }
      responses: { "200": { description: Session }, "401": { description: Token rejected }, "503": { description: Provider not configured } }
  /api/v1/auth/google:
    post:
      summary: Exchange a Google ID token for a session
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id_token], properties: { id_token: { type: string } } } } } }
      responses: { "200": { description: Session }, "401": { description: Token rejected }, "503": { description: Provider not configured } }
  /api/v1/auth/session:
    delete:
      summary: Revoke the current session
      security: [{ bearer: [] }]
      responses: { "204": { description: Revoked }, "401": { description: Unauthorized } }
  /api/v1/me:
    get:
      summary: Current account
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
  /api/v1/me/tours:
    get:
      summary: List my routes
      security: [{ bearer: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned by the previous response }
      responses: { "200": { description: OK } }
    post:
      summary: Create a draft route from 2 to 30 published places in one city
      description: New personal routes are owner-only drafts. Visibility applies after publication; sharing requires current passing path quality and explicit publication.
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateUserTourRequest" } } } }
      responses: { "201": { description: Draft created, unlisted visibility by default }, "404": { description: Unknown city }, "422": { description: Validation failed } }
  /api/v1/me/tours/{id}:
    get:
      summary: Get one of my routes
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not mine or not found } }
    patch:
      summary: Update title, summary, modes, visibility, or stops
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserTourRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not mine or not found }, "422": { description: Validation failed } }
    delete:
      summary: Delete one of my routes
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Deleted }, "404": { description: Not mine or not found } }
  /api/v1/me/saved:
    get:
      summary: List saved tours
      security: [{ bearer: [] }]
      responses: { "200": { description: OK } }
  /api/v1/me/saved/{tour}:
    put:
      summary: Save a tour
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Saved }, "404": { description: Not found } }
    delete:
      summary: Unsave a tour
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: Removed }, "404": { description: Not found } }
  /api/v1/me/progress:
    get:
      summary: List my progress on every tour
      security: [{ bearer: [] }]
      responses: { "200": { description: OK } }
  /api/v1/me/progress/{tour}:
    get:
      summary: Get my progress on a tour
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
    put:
      summary: Record my progress on a tour
      description: Atomically unions visited positions and preserves completion. Send reset=true without visited positions or completed=true to start over. Progress is shared across travel modes for this account and tour.
      security: [{ bearer: [] }]
      parameters: [{ name: tour, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProgressRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed } }
  /api/v1/admin/cities:
    get:
      summary: "List cities (any status)"
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Create a city"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateCityRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/cities/{id}:
    patch:
      summary: "Update a city"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCityRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/topics:
    get:
      summary: "List a city's topics (?city= required)"
      parameters:
        - { name: city, in: query, required: true, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    post:
      summary: "Create a topic"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTopicRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/topics/{id}:
    patch:
      summary: "Update a topic"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTopicRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/places:
    get:
      summary: "List places in any status (?city=, ?limit=, ?cursor=)"
      parameters:
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Create a draft place"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePlaceRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/places/{id}:
    get:
      summary: "Get a place with all its moments"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    patch:
      summary: "Update a place, including its primary moment"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePlaceRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
    delete:
      summary: "Archive a place"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/places/{id}/media:
    put:
      summary: Replace ordered photos, documents and video references for a place
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaListRequest" } } } }
      responses:
        "200": { description: Updated place, content: { application/json: { schema: { $ref: "#/components/schemas/PlaceDetail" } } } }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "404": { description: Place or asset not found }
        "409": { description: Published place requires complete file rights or external reference metadata }
        "422": { description: Invalid attachment list }
  /api/v1/admin/places/{id}/publish:
    post:
      summary: "Publish a place with a published, illustrated and sourced primary history"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Primary history is missing or incomplete }, "401": { description: Unauthorized } }
  /api/v1/admin/places/{id}/unpublish:
    post:
      summary: "Return a place to draft"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/moments:
    get:
      summary: "List a place's moments in any status (?place= required, ?city=)"
      parameters:
        - { name: place, in: query, required: true, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    post:
      summary: "Create a draft moment with sources and topics"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateMomentRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}:
    get:
      summary: "Get a moment in any status"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    patch:
      summary: "Update a moment's text and dates"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMomentRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
    delete:
      summary: "Archive a moment"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/publish:
    post:
      summary: "Publish a sourced history of at least 250 words and three paragraphs with a credited reusable picture; enqueues narration"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Conflict }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/unpublish:
    post:
      summary: "Return a moment to draft"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/media:
    put:
      summary: "Replace the ordered media list"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaListRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/sources:
    put:
      summary: "Replace the ordered sources"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SourcesRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/moments/{id}/topics:
    put:
      summary: "Replace the topic set"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TopicsRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/media:
    get:
      summary: "List media assets newest first (?limit=, ?offset=)"
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Upload a photo, PDF, plain-text document or audio file (64 MiB maximum); video uploads are disabled"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, caption: { type: string }, credit: { type: string }, license: { type: string }, license_url: { type: string }, source_url: { type: string } } } } } }
      responses: { "201": { description: Created }, "400": { description: Bad request }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/media/links:
    post:
      summary: Add an external video or document link without downloading or embedding it
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaLinkRequest" } } } }
      responses:
        "201": { description: Created reference, content: { application/json: { schema: { $ref: "#/components/schemas/MediaAsset" } } } }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "422": { description: Invalid kind, URL, title or creator }
  /api/v1/admin/media/{id}:
    patch:
      summary: "Update asset metadata and licence"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MediaMetadataRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/tours:
    get:
      summary: "List tours in any status and visibility (?city=)"
      parameters:
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      security: [{ bearer: [] }]
      responses: { "200": { description: OK }, "401": { description: Unauthorized } }
    post:
      summary: "Create a draft curated tour, optionally with stops"
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateTourRequest" } } } }
      responses: { "201": { description: Created }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}:
    get:
      summary: "Get a tour in any status"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "401": { description: Unauthorized } }
    patch:
      summary: "Update a tour; changing modes adds or drops routes"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTourRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
    delete:
      summary: "Delete a tour"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "204": { description: No content }, "404": { description: Not found }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/stops:
    put:
      summary: "Replace the stop list and requeue routes"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StopsRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "422": { description: Validation failed }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/publish:
    post:
      summary: "Publish a tour; requires published places, ready geometry and current passing path quality"
      description: Atomically snapshot an expected draft and advance its published pointer. An omitted body uses the server-loaded versions for older clients; revision-aware clients send both expected values. Current routing inputs and the computed result must match retained quality; missing, stale, blocked and needs-research reports refuse publication.
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/PublishRevisionRequest" } } } }
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Conflict }, "401": { description: Unauthorized } }
  /api/v1/admin/tours/{id}/unpublish:
    post:
      summary: "Return a tour to draft"
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
