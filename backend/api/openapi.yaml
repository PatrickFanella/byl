        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Record is not linked to this brief }
  /api/v1/admin/route-briefs/{id}/reconciliation/{record}/decision:
    put:
      summary: Append a versioned curator identity decision without merging collection rows
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: record, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/IdentityDecisionRequest" } } } }
      responses:
        "200": { description: Private decision recorded, content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationRecord" } } } }
        "400": { description: Invalid JSON }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Record is not linked to this brief }
        "409": { description: Decision changed; reload before review }
