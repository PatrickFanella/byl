    ArrivalProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        base_version: { type: integer, minimum: 0 }
        point: { $ref: "#/components/schemas/ArrivalPoint" }
        status: { type: string, enum: [pending, approved, rejected] }
        created_by: { type: string, format: uuid }
        reviewed_by: { type: string, nullable: true }
        review_note: { type: string }
        created_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time, nullable: true }
    ArrivalSelection:
      type: object
      properties:
        place_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/TravelMode" }
        eligibility: { type: string, enum: [unknown, allowed, restricted, closed] }
        navigation_point: { type: object, nullable: true, properties: { lat: { type: number }, lng: { type: number } } }
        arrival: { $ref: "#/components/schemas/ApprovedArrival", nullable: true }
    IdentityFacts:
      type: object
      additionalProperties: false
      properties:
        city_id: { type: string }
        place_name: { type: string }
        aliases: { type: array, maxItems: 20, items: { type: string } }
        address: { type: string }
        historical_addresses: { type: array, maxItems: 20, items: { type: string } }
        moved: { type: boolean }
        moment_title: { type: string }
        date_start: { type: string, description: YYYY-MM-DD when known }
        date_precision: { type: string, enum: [day, month, year, circa] }
    DiscoveryOrigin:
      type: object
      additionalProperties: false
      properties:
        provider: { type: string }
        query: { type: string }
        url: { type: string }
        reasons: { type: array, items: { type: string } }
    DiscoveryItem:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind: { type: string, enum: [place, moment] }
        entity_id: { type: string, description: Existing collection identifier, checked locally }
        title: { type: string, maxLength: 500 }
        text: { type: string, description: Untrusted private source excerpt; never copied into visitor narration }
        url: { type: string, maxLength: 2000 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        area: { type: string }
        evidence: { type: string, description: Untrusted source classification }
        origins: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/DiscoveryOrigin" } }
        identity: { $ref: "#/components/schemas/IdentityFacts" }
    ReconciliationRequest:
      type: object
      additionalProperties: false
      required: [version, item]
      properties:
        version: { type: integer, minimum: 1 }
        item: { $ref: "#/components/schemas/DiscoveryItem", description: At most 32768 encoded bytes }
    ReconciliationProposal:
      type: object
      properties:
        item: { $ref: "#/components/schemas/DiscoveryItem" }
        key: { type: string }
        place_key: { type: string }
        city_id: { type: string }
        place_id: { type: string }
        moment_id: { type: string }
        outcome: { type: string, enum: [existing_place, existing_place_existing_moment, existing_place_new_moment, new_place, needs_review, rejected] }
        issues: { type: array, items: { type: string } }
    IdentityDecisionRequest:
      type: object
      additionalProperties: false
      required: [version, outcome, note]
      properties:
        version: { type: integer, minimum: 0, description: Last review_version; zero for first decision }
        outcome: { type: string, enum: [existing_place, existing_place_existing_moment, existing_place_new_moment, needs_review, rejected] }
        place_id: { type: string }
        moment_id: { type: string }
        aliases: { type: array, maxItems: 20, items: { type: string } }
        historical_addresses: { type: array, maxItems: 20, items: { type: string } }
        note: { type: string, minLength: 1, maxLength: 4000 }
    IdentityDecision:
      allOf:
        - $ref: "#/components/schemas/IdentityDecisionRequest"
        - type: object
          properties:
            reviewer_id: { type: string, format: uuid }
    ReconciliationSource:
      type: object
      properties:
        brief_id: { type: string, format: uuid }
        run_id: { type: string, nullable: true }
        proposal: { $ref: "#/components/schemas/ReconciliationProposal" }
    ReconciliationRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        identity_key: { type: string }
        proposal: { $ref: "#/components/schemas/ReconciliationProposal", description: Original inference retained unchanged; current curator decision is separate }
        assessment: { $ref: "#/components/schemas/ReconciliationProposal", description: Latest retained inference; an explicit curator decision takes precedence }
        place_candidate_id: { type: string, nullable: true }
        moment_candidate_id: { type: string, nullable: true }
        review_version: { type: integer }
        decision: { $ref: "#/components/schemas/IdentityDecision", nullable: true }
        created_at: { type: string, format: date-time }
    EvidenceRequest:
      type: object
      additionalProperties: false
      required: [version, url]
      properties:
        version: { type: integer, minimum: 1 }
        url: { type: string, format: uri, maxLength: 2000, description: Fragment is retained separately as a supplied reference; it does not prove a PDF page was inspected }
        source_kind: { type: string, enum: [page, catalog], default: page, description: Catalog descriptions remain catalog-only evidence }
    EvidencePassage:
      type: object
      required: [reference, text]
      properties:
        reference: { type: string, description: Paragraph index in the retained excerpt, maxLength: 100 }
        text: { type: string, maxLength: 20000, description: Untrusted source data; never instructions to a model or worker }
    EvidenceResult:
      type: object
      required: [outcome, final_url, publisher, title, retrieved_at, http_status, content_type, content_sha256, passages, truncated, untrusted, media_reuse]
      properties:
        outcome: { type: string, enum: [inspected_page, catalog_only, search_snippet, blocked, timeout, unavailable, inaccessible, too_large, unsupported_format, unsupported_encoding, no_readable_text, worker_failed] }
        final_url: { type: string }
        publisher: { type: string, description: Final source hostname; not an inferred institutional author }
        title: { type: string, maxLength: 500 }
        retrieved_at: { type: string, format: date-time, description: Retrieval-attempt time; failures are not successful retrievals }
        http_status: { type: integer }
        content_type: { type: string }
        content_sha256: { type: string, description: Hash of the inspected bounded response, not just the excerpt; empty for unread bodies }
        passages: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/EvidencePassage" }, description: Combined maximum 20000 characters }
        truncated: { type: boolean }
        untrusted: { type: boolean, const: true }
        media_reuse: { type: string, enum: [unresolved], description: Text access and page metadata never grant media copying permission; no media is fetched }
    SourceEvidence:
      type: object
      required: [id, brief_id, brief_version, job_id, source_key, url, reference, source_kind, result, created_at]
      properties:
        id: { type: string, format: uuid }
        brief_id: { type: string, format: uuid }
        brief_version: { type: integer }
        job_id: { type: string, format: uuid }
        source_key: { type: string, description: SHA256 of the normalized URL; stable across fragments and retrievals }
        url: { type: string, format: uri }
        reference: { type: string, description: Original supplied URL fragment; distinct from an inspected passage reference }
        source_kind: { type: string, enum: [page, catalog] }
        result: { oneOf: [{ $ref: "#/components/schemas/EvidenceResult" }, { type: "null" }], description: Null while pending; the first completed snapshot is retained unchanged }
        created_at: { type: string, format: date-time }
    SourceEvidenceList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SourceEvidence" } }
        next_cursor: { type: string, description: Empty; use limit and offset }
    CuratorReviewPackage:
      type: object
      required: [schema_version, version, state, ready_to_publish, brief, research, submitted, proposal, tour, routes, path_reports, reconciliation, entities, evidence, tasks, visitor_stories]
      description: At most 20 reconciliation records, 64 stage candidates, 64 sources and 8 MiB serialized. Every relevant current dependency affects the deterministic SHA-256 version. No rows, publication decisions or provider requests are created by reading.
      properties:
        schema_version: { type: integer, enum: [1] }
        version: { type: string, pattern: '^[a-f0-9]{64}$' }
        state: { type: string, enum: [not_started, processing, needs_research, stale, ready_for_review] }
        ready_to_publish: { type: boolean, description: Eligibility for separate explicit curator approval, not an approval or field-access certificate }
        brief: { $ref: "#/components/schemas/RouteBrief" }
        research: { $ref: "#/components/schemas/ResearchRun", nullable: true }
        submitted: { $ref: "#/components/schemas/RouteBriefInput", nullable: true, description: Frozen submitted input for the selected retained run }
        proposal: { $ref: "#/components/schemas/ItineraryProposal", nullable: true }
        tour: { $ref: "#/components/schemas/TourDetail", nullable: true, description: Current prepared working copy; no publication is performed }
        routes:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TourRoute", nullable: true }
        path_reports:
          type: object
          additionalProperties: { $ref: "#/components/schemas/PathQualityReport", nullable: true }
        reconciliation: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ReconciliationRecord" } }
        entities: { type: array, items: { $ref: "#/components/schemas/ReviewPackageEntity" } }
        evidence: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/SourceEvidence" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/ReviewPackageTask" } }
        visitor_stories: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/ReviewVisitorStory" } }
    ReviewPackageEntity:
      type: object
      required: [key, kind, id, required, disposition, current, candidate, proposed, proposal_source, changes]
      properties:
        key: { type: string, description: Kind-qualified existing or candidate identity }
        kind: { type: string, enum: [place, moment, media, candidate] }
        id: { type: string }
        required: { type: boolean, description: Selected dependency versus contextual lead; an unselected candidate is not approved by reviewing this package }
        disposition: { type: string, enum: [new_entity, reused_published, reused_draft, proposed_shared_edit, proposed_draft_edit, unavailable] }
        current: { type: object, nullable: true, additionalProperties: true, description: Typed current place summary, complete moment or media; null for new entities }
        candidate: { $ref: "#/components/schemas/Candidate", nullable: true }
        proposed: { type: object, nullable: true, additionalProperties: true, description: Private candidate editor input or latest unapplied generated draft; never silently applied }
        proposal_source: { type: string, enum: ["", candidate_editor, generated_draft_unapplied] }
        changes:
          type: array
          items:
            type: object
            required: [field, before, after]
            properties:
              field: { type: string }
              before: { nullable: true, description: Previous JSON field value }
              after: { nullable: true, description: Proposed JSON field value }
    ReviewPackageTask:
      type: object
      required: [code, entity_key, detail]
      properties:
        code: { type: string }
        entity_key: { type: string }
        detail: { type: string }
    ReviewVisitorStory:
      type: object
      required: [position, place_id, moment_id, candidate_id, title, body, text_source, source_urls, evidence_ids]
      properties:
        position: { type: integer, minimum: 1 }
        place_id: { type: string }
        moment_id: { type: string }
        candidate_id: { type: string }
        title: { type: string }
        body: { type: string, description: Full selected current story or validated generated draft; captured paragraph only when stale/unavailable }
        text_source: { type: string, enum: [curated_record, evidence_linked_draft, captured_partial] }
        source_urls: { type: array, nullable: true, items: { type: string } }
        evidence_ids: { type: array, nullable: true, items: { type: string } }
    ItineraryMaterial:
      type: object
      required: [record_id, review_version, place_id, place_name, city_id, latitude, longitude, moment_title, narrative, evidence_kind, content_sha256, source_urls, evidence_ids]
      properties:
        record_id: { type: string, format: uuid }
        review_version: { type: integer, minimum: 0 }
        place_id: { type: string, format: uuid }
        place_name: { type: string }
        city_id: { type: string, format: uuid }
        latitude: { type: number }
        longitude: { type: number }
        moment_id: { type: string, format: uuid }
        candidate_id: { type: string, format: uuid }
        moment_title: { type: string }
        narrative: { type: string, maxLength: 2000, description: Exact retained paragraph or evidence-linked claim, not fresh generated history }
        evidence_kind: { type: string, enum: [curated_record, evidence_linked_draft] }
        content_sha256: { type: string }
        source_urls: { type: array, maxItems: 5, items: { type: string, format: uri } }
        evidence_ids: { type: array, maxItems: 5, items: { type: string, format: uuid } }
    ItineraryGap:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        detail: { type: string }
        record_id: { type: string, format: uuid }
        place_candidate_id: { type: string, format: uuid, nullable: true }
        moment_candidate_id: { type: string, format: uuid, nullable: true }
    ItineraryStop:
      type: object
      required: [material, theme_reason, what_to_notice, transition, planned_dwell_minutes, planned_narration_minutes]
      properties:
        material: { $ref: "#/components/schemas/ItineraryMaterial" }
        theme_reason: { type: string }
        what_to_notice: { type: string, description: Explicit curator research question until current viewing guidance is independently supported }
        transition: { type: string, description: Thematic transition, never turn directions or an access assertion }
        planned_dwell_minutes: { type: integer, minimum: 0 }
        planned_narration_minutes: { type: integer, minimum: 0 }
    ItineraryProposal:
      type: object
      required: [version, status, created_at, title, introduction, requested_shape, trip_shape, modes, target_duration_minutes, travel_minutes, travel_state, planned_dwell_minutes, planned_narration_minutes, stops, travel_sequence, excluded, research_gaps, assumptions]
      description: Private unpublished proposal. Travel sequence contains zero-based stop indices, including non-narrated closing or retraced travel. Optimistic straight-line screening is not computed route distance, legal access or publication readiness.
      properties:
        version: { type: integer, enum: [1] }
        status: { type: string, enum: [draft, needs_research] }
        created_at: { type: string, format: date-time }
        title: { type: string }
        introduction: { type: string }
        requested_shape: { type: string, enum: [flexible, loop, point_to_point, out_and_back] }
        trip_shape: { type: string, enum: [loop, point_to_point, out_and_back] }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        target_duration_minutes: { type: integer, nullable: true }
        travel_minutes: { type: integer, nullable: true, description: Null until actual route computation; never filled by geographic screening }
        travel_state: { type: string, enum: [not_computed] }
        planned_dwell_minutes: { type: integer, minimum: 0 }
        planned_narration_minutes: { type: integer, minimum: 0 }
        stops: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/ItineraryStop" } }
        travel_sequence: { type: array, maxItems: 15, items: { type: integer, minimum: 0, maximum: 7 } }
        excluded:
          type: array
          items:
            type: object
            required: [material, reason]
            properties:
              material: { $ref: "#/components/schemas/ItineraryMaterial" }
              reason: { type: string }
        research_gaps: { type: array, items: { $ref: "#/components/schemas/ItineraryGap" } }
        assumptions: { type: array, items: { type: string } }
    BriefItinerary:
      type: object
      required: [run_id, source_version, brief_version, proposal]
      properties:
        run_id: { type: string, format: uuid }
        source_version: { type: integer, minimum: 1 }
        brief_version: { type: integer, minimum: 1 }
        proposal: { $ref: "#/components/schemas/ItineraryProposal", nullable: true }
    ResearchActionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        run_id: { type: string, format: uuid, description: Required for cancel/resume; omit for start }
    ResearchAttempt:
      type: object
      required: [attempt, status, reason]
      properties:
        attempt: { type: integer, minimum: 1, maximum: 3 }
        status: { type: string, enum: [running, completed, failed, interrupted, cancelled] }
        reason: { type: string, description: Safe code; never provider response text }
    ResearchStage:
      type: object
      required: [stage, status, attempts, reason, candidate_ids, outcomes]
      properties:
        stage: { type: string, enum: [research, reconciliation, drafting, assembly] }
        status: { type: string, enum: [pending, running, completed, needs_research] }
        attempts: { type: integer, minimum: 0, maximum: 3 }
        reason: { type: string }
        candidate_ids: { type: array, items: { type: string, format: uuid } }
        outcomes: { type: array, items: { $ref: "#/components/schemas/ResearchAttempt" } }
    ResearchRun:
      type: object
      required: [id, brief_id, job_id, source_version, brief_version, status, reason, requests_used, tokens_reserved, request_limit, token_limit, deadline_at, created_at, stages]
      properties:
        id: { type: string, format: uuid }
        brief_id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        source_version: { type: integer }
        brief_version: { type: integer }
        status: { type: string, enum: [active, completed, needs_research, cancelled] }
        reason: { type: string }
        requests_used: { type: integer, description: Durably charged before each processor operation; failed or interrupted calls remain charged }
        tokens_reserved: { type: integer, description: Conservative model-token reservation; unknown crash usage is not refunded }
        request_limit: { type: integer, maximum: 12 }
        token_limit: { type: integer, maximum: 20000 }
        deadline_at: { type: string, format: date-time, description: Original 15-minute deadline, retained across resume }
        created_at: { type: string, format: date-time }
        stages: { type: array, items: { $ref: "#/components/schemas/ResearchStage" } }
    BriefStatus:
      type: string
      enum: [draft, processing, needs_research, review, accepted, declined]
    RouteBriefInput:
      type: object
      additionalProperties: false
      required: [topic, area]
      description: Unverified submitted notes and leads. Kept separate from source evidence and generated public text. No links are fetched during intake.
      properties:
        topic: { type: string, minLength: 1, maxLength: 300 }
        area: { type: string, minLength: 1, maxLength: 500 }
        notes: { type: string, maxLength: 10000, default: "" }
        place_leads: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 2000 }, description: Unresolved names or addresses are allowed }
        event_leads: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 2000 } }
        source_links: { type: array, maxItems: 20, items: { type: string, format: uri, minLength: 1, maxLength: 2000 }, description: HTTP or HTTPS only; no embedded credentials }
        modes: { type: array, maxItems: 2, uniqueItems: true, items: { $ref: "#/components/schemas/TravelMode" }, description: Defaults to walk and bike }
        trip_shape: { type: string, enum: [flexible, loop, point_to_point, out_and_back], default: flexible }
        duration_minutes: { type: [integer, "null"], minimum: 15, maximum: 1440 }
        start_preference: { type: string, maxLength: 500, default: "" }
        end_preference: { type: string, maxLength: 500, default: "" }
        pilot_id: { type: string, maxLength: 100, default: "" }
    RouteBrief:
      type: object
      required: [id, owner_account_id, submitted, status, reason, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_account_id: { type: string, format: uuid }
        submitted: { $ref: "#/components/schemas/RouteBriefInput" }
        status: { $ref: "#/components/schemas/BriefStatus" }
        reason: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RouteBriefList:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RouteBrief" } }
        next_cursor: { type: string, description: Empty; use limit and offset }
    UpdateRouteBriefRequest:
      type: object
      additionalProperties: false
      required: [version, submitted]
      properties:
        version: { type: integer, minimum: 1 }
        submitted: { $ref: "#/components/schemas/RouteBriefInput" }
    BriefStateRequest:
      type: object
      additionalProperties: false
      required: [version, status, reason]
      properties:
        version: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/BriefStatus" }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [bad_request, validation_failed, unauthorized, forbidden, not_found, conflict, unavailable, internal, intake_disabled, submission_limit] }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    List:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: string, description: Empty when there is no further page }
    City:
      type: object
      required: [id, slug, name, region, country_code, center_lat, center_lng, bbox, timezone, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        country_code: { type: string }
        center_lat: { type: number }
        center_lng: { type: number }
        bbox: { type: object, properties: { min_lat: { type: number }, min_lng: { type: number }, max_lat: { type: number }, max_lng: { type: number } } }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CityDetail:
      allOf:
        - $ref: "#/components/schemas/City"
        - type: object
          properties:
            topics: { type: array, items: { $ref: "#/components/schemas/Topic" } }
    Topic:
      type: object
      required: [id, city_id, slug, name, description, moment_count]
      properties:
        id: { type: string, format: uuid }
        city_id: { type: string, format: uuid, description: Original municipality retained for existing city/slug references }
        city_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true, readOnly: true, description: Municipalities sharing this theme; includes city_id. Optional on older API versions. }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        moment_count: { type: integer, description: Published moments carrying this topic }
    MediaAsset:
      type: object
      required: [id, kind, external, public_url, mime_type, caption, credit, license, license_url, source_url, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [image, video, audio, document] }
        external: { type: boolean, description: True for references opened at the source; never downloaded or embedded }
        storage_key: { type: string, readOnly: true, description: Blob-store key; empty until an imported asset is fetched }
        public_url: { type: string, format: uri }
        mime_type: { type: string }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_seconds: { type: number, nullable: true }
        caption: { type: string }
        credit: { type: string }
        license: { type: string, description: "Licence identifier such as CC-BY-4.0, CC0-1.0, PD-US, all-rights-reserved" }
        license_url: { type: string }
        source_url: { type: string }
        status: { $ref: "#/components/schemas/EntityStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EntityStatus:
      type: string
      enum: [draft, in_review, published, archived]
    TravelMode:
      type: string
      enum: [walk, bike]
    PlaceSummary:
      type: object
      required: [id, city_id, slug, name, summary, kind, latitude, longitude, arrival_radius_m, address, status, moment_count, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        city_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        kind: { type: string, description: "building, park, street, station, monument, site, or free text" }
        latitude: { type: number }
        longitude: { type: number }
        arrival_radius_m: { type: number }
        arrival_point: { $ref: "#/components/schemas/ApprovedArrival", nullable: true, description: Null when public access has not been reviewed }
        arrival_version: { type: integer, minimum: 0, description: Zero for legacy places without an approved arrival }
        address: { type: string }
        status: { $ref: "#/components/schemas/EntityStatus" }
        primary_moment_id: { type: string, format: uuid, nullable: true }
        moment_count: { type: integer }
        distance_m: { type: number, description: "Only present on ?near= queries" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PlaceDetail:
      allOf:
        - $ref: "#/components/schemas/PlaceSummary"
        - type: object
          properties:
            primary_moment: { $ref: "#/components/schemas/MomentSummary", nullable: true }
            moments: { type: array, items: { $ref: "#/components/schemas/MomentSummary" } }
            media: { type: array, items: { $ref: "#/components/schemas/MediaAsset" } }
    Source:
      type: object
      required: [title]
      properties:
        title: { type: string }
        url: { type: string }
        publisher: { type: string }
        retrieved_at: { type: string, format: date, nullable: true }
        license: { type: string }
        note: { type: string }
    MomentSummary:
      type: object
      required: [id, place_id, slug, title, excerpt, date_precision, date_display, has_narration, status, topic_ids]
      properties:
        id: { type: string, format: uuid }
        place_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        date_start: { type: string, format: date, nullable: true }
        date_end: { type: string, format: date, nullable: true }
        date_precision: { type: string, enum: [day, month, year, circa] }
        date_display: { type: string }
        hero_media: { $ref: "#/components/schemas/MediaAsset", nullable: true }
        has_narration: { type: boolean }
        status: { $ref: "#/components/schemas/EntityStatus" }
        topic_ids: { type: array, items: { type: string, format: uuid } }
    MomentDetail:
      allOf:
        - $ref: "#/components/schemas/MomentSummary"
        - type: object
          required: [body, media, sources, topics]
          properties:
            body: { type: string, description: Markdown }
            media: { type: array, items: { $ref: "#/components/schemas/MediaAsset" } }
            sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
            topics: { type: array, items: { $ref: "#/components/schemas/Topic" } }
            narration: { $ref: "#/components/schemas/MediaAsset", nullable: true, description: "Audio asset; null means use on-device speech" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RouteJourney:
      type: object
      description: Versioned read projection of selected computed travel and approved public references. A usable path is eligible for curator review, not automatic publication or field certification. Legacy route fields remain travel-only.
      required: [version, state, computation, quality, usable, issue_codes, travel_distance_m, travel_duration_s, dwell_duration_s, narration_duration_s, itinerary_duration_s, round_trip_duration_s, return_plan, segments, assumptions]
      properties:
        version: { type: integer, enum: [1] }
        state: { type: string, enum: [missing, pending, failed, unreviewed, needs_research, blocked, stale, unavailable, usable] }
        computation: { type: string, enum: [missing, pending, ready, failed] }
        quality: { type: string, enum: [unreviewed, pass, needs_research, blocked] }
        usable: { type: boolean, description: Current passing quality and available selected geometry; not a publication decision }
        issue_codes: { type: array, items: { type: string }, description: Deduplicated outcome codes; no private findings or source passages }
        travel_distance_m: { type: number, nullable: true, minimum: 0 }
        travel_duration_s: { type: integer, nullable: true, minimum: 0 }
        dwell_duration_s: { type: integer, minimum: 0, description: Assumed 180 seconds per stop }
        narration_duration_s: { type: integer, minimum: 0, description: Assumed 120 seconds per featured story; not measured audio duration }
        itinerary_duration_s: { type: integer, nullable: true, description: Selected computed travel plus dwell and narration; null without geometry. Includes an explicitly computed return once. }
        round_trip_duration_s: { type: integer, nullable: true, description: Same itinerary total only when a closing return is included; otherwise unknown }
        return_plan:
          type: object
          required: [status, distance_m, duration_s]
          properties:
            status: { type: string, enum: [included, unplanned] }
            distance_m: { type: number, nullable: true }
            duration_s: { type: integer, nullable: true }
        segments: { type: array, items: { $ref: "#/components/schemas/JourneySegment" } }
        assumptions: { type: array, items: { type: string } }
    JourneySegment:
      type: object
      description: Ordered approved reference traversal, including repeats and reverse directions. No inferred match to provider edges and no estimated segment distance/time. Surface and access are sourced curator assertions, not current field proof.
      required: [id, kind, reverse, basis, surface, modes, access, source]
      properties:
        id: { type: string }
        kind: { type: string, enum: [trail, road_connector] }
        reverse: { type: boolean }
        basis: { type: string, enum: [approved_reference] }
        surface: { type: string, nullable: true, maxLength: 80, description: Unknown when absent from approved reference }
        modes: { type: array, nullable: true, items: { $ref: "#/components/schemas/TravelMode" } }
        access: { type: string, enum: [allowed, unknown, restricted, closed] }
        source:
          type: object
          required: [url, title, publisher, version, retrieved_on, license, license_url]
          properties:
            url: { type: string, format: uri }
            title: { type: string }
            publisher: { type: string }
            version: { type: string }
            retrieved_on: { type: string, format: date }
            license: { type: string }
            license_url: { type: string, format: uri }
    RouteSummary:
      type: object
      required: [mode, status, distance_m, duration_s]
      properties:
        quality: { $ref: "#/components/schemas/PathQualitySummary" }
        mode: { $ref: "#/components/schemas/TravelMode" }
        status: { type: string, enum: [pending, ready, failed] }
        distance_m: { type: number }
        duration_s: { type: integer }
        estimated_minutes: { type: integer, nullable: true, description: Travel-only rounded-up minutes when status is ready; does not imply usable quality or include stop time }
        error: { type: string }
        computed_at: { type: string, format: date-time, nullable: true }
    RouteLeg:
      type: object
      required: [from_position, to_position, distance_m, duration_s, geometry]
      properties:
        from_stop_id: { type: string, format: uuid, description: Stable story boundary for approved navigation }
        to_stop_id: { type: string, format: uuid, description: Stable story boundary for approved navigation }
        navigation_source: { type: string, enum: [approved_navigation], description: Provider-computed approved controls; does not certify current access or path quality }
        return: { type: boolean, description: Closing travel from the last story stop to the first; creates no additional narrated stop }
        from_position: { type: integer }
        to_position: { type: integer }
        distance_m: { type: number }
        duration_s: { type: integer }
        geometry: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }, description: "[lng, lat] pairs" }
    TourRoute:
      type: object
      required: [id, tour_id, mode, status, provider, distance_m, duration_s, legs]
      properties:
        journey: { $ref: "#/components/schemas/RouteJourney", description: Additive projection; absent on older APIs }
        quality: { $ref: "#/components/schemas/PathQualitySummary" }
        id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/TravelMode" }
        status: { type: string, enum: [pending, ready, failed] }
        provider: { type: string }
        distance_m: { type: number }
        duration_s: { type: integer }
        geometry:
          nullable: true
          type: object
          description: GeoJSON LineString
          properties:
            type: { type: string, enum: [LineString] }
            coordinates: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
        legs: { type: array, items: { $ref: "#/components/schemas/RouteLeg" } }
        error: { type: string }
        computed_at: { type: string, format: date-time, nullable: true }
    TourSummary:
      type: object
      required: [id, city_id, slug, title, summary, modes, status, visibility, stop_count, routes, created_at, updated_at]
      properties:
        draft_version: { type: integer, format: int64, minimum: 0, description: Editable working-copy generation; snapshot reads return their captured generation }
        route_version: { type: integer, format: int64, minimum: 0 }
        revision_id: { type: string, nullable: true, description: Current release for editing views; served revision for public views }
        revision_number: { type: integer, format: int64, minimum: 0 }
        id: { type: string, format: uuid }
        city_id: { type: string, format: uuid, description: Original discovery city retained for older clients; stops retain their actual municipalities }
        city_ids: { type: array, items: { type: string, format: uuid }, uniqueItems: true, readOnly: true, description: Original city plus municipalities of the current stops. Optional on older API versions. }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        topic_id: { type: string, format: uuid, nullable: true }
        topic: { $ref: "#/components/schemas/Topic", nullable: true }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        hero_media: { $ref: "#/components/schemas/MediaAsset", nullable: true }
        status: { $ref: "#/components/schemas/EntityStatus" }
        visibility: { type: string, enum: [public, unlisted, private] }
        owner_account_id: { type: string, format: uuid, nullable: true, description: Set for user routes }
        stop_count: { type: integer }
        routes: { type: object, additionalProperties: { $ref: "#/components/schemas/RouteSummary" }, description: Keyed by mode }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TourStop:
      type: object
      required: [id, position, place, note]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer, description: 1-based }
        place: { $ref: "#/components/schemas/PlaceSummary" }
        featured_moment_id: { type: string, format: uuid, nullable: true, description: Curator's explicit choice, or null }
        featured_moment: { $ref: "#/components/schemas/MomentSummary", nullable: true, description: The explicit choice or the place's primary moment }
        note: { type: string }
    TourDetail:
      allOf:
        - $ref: "#/components/schemas/TourSummary"
        - type: object
          required: [stops]
          properties:
            transit: { $ref: "#/components/schemas/ApprovedTransit", readOnly: true, description: "Working curator selection or frozen revision selection. Mixed walk routes require scheduled-transit-v1 capability and an explicit timetable plan; they have no continuous routes.walk geometry." }
            journeys:
              type: object
              readOnly: true
              description: All requested modes, including missing results. Derived from the selected working copy or frozen revision; absent on older APIs. Legacy routes map and summaries keep their meaning.
              additionalProperties: { $ref: "#/components/schemas/RouteJourney" }
            corridor: { $ref: "#/components/schemas/ApprovedCorridor", readOnly: true, description: "Working approved intent in editing reads; frozen released intent in public/revision reads. Omitted before any approved intent." }
            stops: { type: array, items: { $ref: "#/components/schemas/TourStop" } }
    TourProgress:
      type: object
      required: [account_id, tour_id, mode, visited_positions, started_at, updated_at]
      properties:
        revision_id: { type: string, format: uuid, description: Legacy positions refer only to this pinned snapshot until explicit reset }
        account_id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/TravelMode" }
        visited_positions: { type: array, items: { type: integer } }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    Account:
      type: object
      required: [id, provider, email, display_name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [apple, google, dev] }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [visitor, curator, admin] }
        last_sign_in_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [token, expires_at, account]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }
    Candidate:
      type: object
      required: [id, kind, origin, payload, status, review_note, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [place, moment, media] }
        origin: { type: string, enum: [import, draft, user] }
        source_name: { type: string, nullable: true }
        external_id: { type: string, nullable: true }
        submitted_by_account_id: { type: string, format: uuid, nullable: true }
        target_place_id: { type: string, format: uuid, nullable: true }
        target_moment_id: { type: string, format: uuid, nullable: true }
        payload:
          type: object
          description: Editable create-request fields plus private import/review context. Drafting appends generated_drafts without replacing title/body/dates/sources. These proposals are never public entities.
          properties:
            generated_drafts: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/HistoricalDraft" } }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewer_account_id: { type: string, format: uuid, nullable: true }
        review_note: { type: string }
        approved_entity_id: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, kind, payload, status, attempts, max_attempts, run_after, last_error, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [compute_route, generate_narration, import_source, draft_candidate, fetch_media] }
        payload: { type: object }
        status: { type: string, enum: [queued, running, done, failed] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        run_after: { type: string, format: date-time }
        last_error: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    StopInput:
      type: object
      required: [place_id]
      properties:
        stop_id: { type: string, format: uuid, description: Optional existing stop identity from this tour with the same place and featured story; omit for a new stop. Legacy requests retain matching identities automatically. }
        place_id: { type: string, format: uuid }
        featured_moment_id: { type: string, format: uuid, nullable: true, description: Ignored for user routes }
        note: { type: string }
    CreateUserTourRequest:
      type: object
      required: [city, title, stops]
      properties:
        city: { type: string, description: City id or slug }
        title: { type: string }
        summary: { type: string }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" }, description: Defaults to both }
        visibility: { type: string, enum: [unlisted, private], default: unlisted }
        stops: { type: array, minItems: 2, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    UpdateUserTourRequest:
      type: object
      properties:
        draft_version: { type: integer, format: int64, minimum: 0 }
        title: { type: string }
        summary: { type: string }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        visibility: { type: string, enum: [unlisted, private] }
        stops: { type: array, minItems: 2, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    ProgressRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        visited_positions: { type: array, items: { type: integer, minimum: 1 } }
        completed: { type: boolean }
        reset: { type: boolean, default: false, description: Explicitly clears visited positions and completion; cannot be combined with nonempty visited_positions or completed=true. }
    CreateCityRequest:
      type: object
      required: [name, center_lat, center_lng, bbox_min_lat, bbox_min_lng, bbox_max_lat, bbox_max_lng]
      properties:
        slug: { type: string }
        name: { type: string }
        region: { type: string }
        country_code: { type: string, default: US }
        center_lat: { type: number }
        center_lng: { type: number }
        bbox_min_lat: { type: number }
        bbox_min_lng: { type: number }
        bbox_max_lat: { type: number }
        bbox_max_lng: { type: number }
        timezone: { type: string, default: America/Chicago }
    UpdateCityRequest:
      type: object
      properties:
        name: { type: string }
        region: { type: string }
        country_code: { type: string }
        center_lat: { type: number }
        center_lng: { type: number }
        bbox_min_lat: { type: number }
        bbox_min_lng: { type: number }
        bbox_max_lat: { type: number }
        bbox_max_lng: { type: number }
        timezone: { type: string }
    CreateTopicRequest:
      type: object
      required: [city_id, name]
      properties:
        city_id: { type: string, format: uuid }
        city_ids: { type: array, maxItems: 30, items: { type: string, format: uuid }, description: Topic coverage; city_id is included automatically. At most 30 municipalities including the original city. }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
    UpdateTopicRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        city_ids: { type: array, nullable: true, maxItems: 30, items: { type: string, format: uuid }, description: Replaces coverage; omitted/null leaves it unchanged and an empty array retains only the original city. Municipalities still used by moments/tours cannot be removed. }
    CreatePlaceRequest:
      type: object
      required: [city_id, name, latitude, longitude]
      properties:
        city_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        summary: { type: string }
        kind: { type: string, default: site }
        latitude: { type: number }
        longitude: { type: number }
        arrival_radius_m: { type: number, default: 40, maximum: 500 }
        address: { type: string }
    UpdatePlaceRequest:
      type: object
      properties:
        name: { type: string }
        summary: { type: string }
        kind: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        arrival_radius_m: { type: number }
        address: { type: string }
        primary_moment_id: { type: string, format: uuid, description: Must belong to the place; empty string clears }
    CreateMomentRequest:
      type: object
      required: [place_id, title]
      properties:
        place_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        body: { type: string, description: Markdown }
        date_start: { type: string, format: date }
        date_end: { type: string, format: date }
        date_precision: { type: string, enum: [day, month, year, circa], default: year }
        date_display: { type: string }
        hero_media_id: { type: string, format: uuid, nullable: true }
        topic_ids: { type: array, items: { type: string, format: uuid } }
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
    UpdateMomentRequest:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        date_start: { type: string, format: date, description: Empty string clears }
        date_end: { type: string, format: date }
        date_precision: { type: string, enum: [day, month, year, circa] }
        date_display: { type: string }
        hero_media_id: { type: string, format: uuid, description: Empty string clears }
    MediaListRequest:
      type: object
      required: [media_ids]
      properties:
        media_ids: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
    SourcesRequest:
      type: object
      required: [sources]
      properties:
        sources: { type: array, items: { $ref: "#/components/schemas/Source" } }
    TopicsRequest:
      type: object
      required: [topic_ids]
      properties:
        topic_ids: { type: array, items: { type: string, format: uuid } }
    MediaLinkRequest:
      type: object
      required: [kind, public_url, caption, credit, source_url]
      properties:
        kind: { type: string, enum: [video, document] }
        public_url: { type: string, format: uri, description: Original http(s) watch or document URL }
        caption: { type: string, minLength: 1, description: Title and relevance to the place or event }
        credit: { type: string, minLength: 1, description: Creator or publisher }
        source_url: { type: string, format: uri }
    MediaMetadataRequest:
      type: object
      properties:
        caption: { type: string }
        credit: { type: string }
        license: { type: string }
        license_url: { type: string }
        source_url: { type: string }
    CreateTourRequest:
      type: object
      required: [city_id, title]
      properties:
        city_id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        topic_id: { type: string, format: uuid, nullable: true }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        hero_media_id: { type: string, format: uuid, nullable: true }
        visibility: { type: string, enum: [public, unlisted, private], default: public }
        stops: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    UpdateTourRequest:
      type: object
      properties:
        draft_version: { type: integer, format: int64, minimum: 0, description: Expected working draft version; legacy omissions use the server-loaded version }
        title: { type: string }
        summary: { type: string }
        topic_id: { type: string, format: uuid, description: Empty string clears }
        modes: { type: array, items: { $ref: "#/components/schemas/TravelMode" } }
        hero_media_id: { type: string, format: uuid, description: Empty string clears }
        visibility: { type: string, enum: [public, unlisted, private] }
    StopsRequest:
      type: object
      required: [stops]
      properties:
        draft_version: { type: integer, format: int64, minimum: 0 }
        stops: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/StopInput" } }
    CreateCandidateRequest:
      type: object
      required: [kind, payload]
      properties:
        kind: { type: string, enum: [place, moment, media] }
        origin: { type: string, enum: [import, draft, user], default: draft }
        source_name: { type: string, nullable: true }
        external_id: { type: string, nullable: true, description: "Unique with source_name; duplicates return 409" }
        target_place_id: { type: string, format: uuid, nullable: true }
        target_moment_id: { type: string, format: uuid, nullable: true }
        payload: { type: object }
    ReviewRequest:
      type: object
      properties:
        note: { type: string }
        payload: { type: object, description: Top-level keys overlaid on the stored payload before creating the entity }
    RoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [visitor, curator, admin] }
    ImportRequest:
      type: object
      required: [source, city]
      properties:
        source: { type: string, description: Adapter name from /admin/sources }
        city: { type: string, description: City id or slug }
        place: { type: string, description: Place id or slug; centres the search and targets moment candidates }
        near: { type: string, description: "lat,lng; centres the search when no place is given" }
        radius_m: { type: number, maximum: 20000 }
        query: { type: string, description: Free text for query-based adapters }
        limit: { type: integer, maximum: 100 }
    Stats:
      type: object
      required: [pending_candidates, jobs, published, user_routes, accounts]
      properties:
        pending_candidates: { type: object, additionalProperties: { type: integer } }
