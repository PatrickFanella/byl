      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationRequest" } } } }
      responses:
        "200": { description: Existing or new private identity record, content: { application/json: { schema: { $ref: "#/components/schemas/ReconciliationRecord" } } } }
        "400": { description: Invalid JSON }
        "401": { description: Authentication required }
        "403": { description: Curator role required }
        "404": { description: Brief not found }
        "409": { description: Brief changed; reload before reconciling }
        "422": { description: Invalid or oversized identity lead }
  /api/v1/admin/route-briefs/{id}/reconciliation/{record}/sources:
    get:
      summary: Page retained source history for a private identity (curators only)
